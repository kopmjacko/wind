<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>wind.</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d1426">
<meta name="description" content="パラモーター向け風況モニター - 気象庁MSM">

<!-- iOS Web App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="wind.">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<!-- Standard favicon -->
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root, [data-theme="dark"] {
    --paper: #0d1426;
    --paper-elev: #16213d;
    --paper-overlay: rgba(13, 20, 38, 0.9);
    --paper-solid: rgba(13, 20, 38, 0.96);
    --ink: #f0e6d2;
    --ink-faint: #8a7e62;
    --gold: #e0a850;
    --green: #5cc88a;
    --alert: #eb5757;
    --line: rgba(240, 230, 210, 0.15);
    --line-soft: rgba(240, 230, 210, 0.08);
    --bg-alt: rgba(255, 255, 255, 0.06);
  }

  * { box-sizing: border-box; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--paper); color: var(--ink);
    font-family: 'Inter', 'Noto Sans JP', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  #map {
    position: absolute; top: 0; left: 0; width: 100%;
    /* シート高 (--sheet-h) と同一ソースで駆動。setSheetHeight() が inline height と
       --sheet-h を同時更新するため、シート上端と map 下端が常に一致し、
       間に body 背景 (ネイビー) が露出しない。ALTパネル高も実測値で整合。 */
    height: calc(100% - var(--sheet-h, 403px) - var(--tab-bar-h));
    /* bottom-sheet の height transition と同期して滑らかに */
    transition: height 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
    background: #e8eef0;
  }

  /* Wind flow particles canvas — pinned to viewport, sits above map tiles, below all overlays */
  #windCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 3;
    pointer-events: none;
  }

  .overlay {
    position: absolute; z-index: 10;
    background: var(--paper-overlay);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
  }

  /* === TOP BAR — edge-to-edge, no rounded corners === */
  .top-bar {
    top: 0;
    left: 0;
    right: 0;
    border-radius: 0;
    border: none;
    border-bottom: 1px solid var(--line);
    /* Account for iOS notch via safe-area, but visually flush to edges */
    padding: calc(env(safe-area-inset-top, 0px) + 6px) 16px 6px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }
  /* Alert state — only the badge appears; no bar background or pulse animation */
  .brand-mark { font-family: 'DM Serif Display', serif; font-size: 18px; font-style: italic; }
  .brand-mark .dot { color: var(--gold); }
  
  /* Location name — clickable when more than one saved point */
  .location-name-wrapper {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--ink);
    cursor: default;
    padding: 2px 0;
    user-select: none;
    -webkit-user-select: none;
  }
  .location-name-wrapper.has-options {
    cursor: pointer;
  }
  .location-name-wrapper.has-options:active {
    opacity: 0.7;
  }
  .location-name { font-weight: 700; font-size: 0.95rem; }
  .dropdown-caret {
    display: none;
    width: 10px;
    height: 10px;
    color: var(--ink-faint);
    transition: transform 0.2s;
  }
  .location-name-wrapper.has-options .dropdown-caret { display: inline-block; }
  .location-name-wrapper.open .dropdown-caret { transform: rotate(180deg); }
  
  /* Dropdown menu — shown when location is tapped (with multiple saved points) */
  .location-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 1px;
    min-width: 200px;
    max-width: 300px;
    background: var(--paper-elev, #16213d);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    z-index: 50;
    display: none;
    overflow: hidden;
  }
  .location-dropdown.show { display: block; }
  .location-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line-soft, rgba(240, 230, 210, 0.06));
    transition: background 0.1s;
  }
  .location-option:last-child { border-bottom: none; }
  .location-option:active,
  .location-option.active {
    background: rgba(224, 168, 80, 0.12);
  }
  .location-option-name {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .location-option.active .location-option-name {
    color: var(--gold);
  }
  .location-option-delete {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint);
    border-radius: 50%;
    flex-shrink: 0;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .location-option-delete:active,
  .location-option-delete:hover {
    background: rgba(235, 87, 87, 0.15);
    color: var(--alert);
  }
  .location-option-delete svg {
    width: 14px; height: 14px;
    stroke-width: 2;
  }

  .current-weather { text-align: right; }
  .current-weather-main {
    display: flex;
    align-items: baseline;
    gap: 6px;
    color: var(--ink);
    justify-content: flex-end;
    line-height: 1;
  }
  .wind-dir {
    font-size: 2.1rem;
    display: inline-block;
    transition: transform 0.3s ease;
    align-self: center;
  }
  .wind-speed {
    font-size: 2.6rem;
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.03em;
    font-family: 'DM Serif Display', serif;
    font-style: italic;
  }
  .wind-speed small {
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--ink-faint);
    margin-left: 2px;
  }
  /* === CENTER PULSE MARKER === */
  .center-marker {
    position: absolute;
    /* 地図領域の中央 = (100% - シート高) / 2。--sheet-h 駆動で #map と完全同期。 */
    top: calc((100% - var(--sheet-h, 403px) - var(--tab-bar-h)) / 2);
    left: 50%;
    transform: translate(-50%, -50%);
    /* シート開閉に合わせて滑らかに移動 (bottom-sheet / #map と同じカーブ) */
    transition: top 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 5;
    pointer-events: none;
    width: 80px; height: 80px;
  }
  .center-marker .pulse {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.7;
    animation: pulse 2s ease-out infinite;
  }
  .center-marker .pulse:nth-child(2) { animation-delay: 0.6s; }
  .center-marker .pulse:nth-child(3) { animation-delay: 1.2s; }
  @keyframes pulse {
    0% { width: 16px; height: 16px; opacity: 0.7; }
    100% { width: 80px; height: 80px; opacity: 0; }
  }
  .center-marker .core {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.5);
  }

  /* === FLOATING ACTION BUTTONS === */
  .fab-stack {
    position: absolute;
    z-index: 8;
    right: 12px;
    bottom: calc(var(--sheet-h, 130px) + var(--tab-bar-h) + 12px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: bottom 0.32s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .fab {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--paper-overlay);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: transform 0.15s ease;
    font-size: 18px;
    line-height: 1;
    padding: 0;
  }
  .fab:active { transform: scale(0.92); }
  .fab.primary { color: var(--gold); }
  .fab svg { width: 20px; height: 20px; }

  /* === BOTTOM SHEET (現: 予報エリア) === */
  :root {
    --day-card-h: 129px;  /* 36 header + 72 chart + 21 time-labels = 129 */
    --day-card-margin: 4px;  /* day-card 間のパディング (time-labels と次の head の間) */
    --stack-top-pad: 4px;  /* リスト最上部の day-card の上のパディング */
    --tab-bar-h: 0px;  /* タブバー廃止済 (元の値保持は無し) */
    --forecast-area-h: calc((var(--day-card-h) + var(--day-card-margin)) * 3 + var(--stack-top-pad));  /* デフォルト: 3日分 + トップpad */
    --field-area-h: calc(var(--day-card-h) + var(--day-card-margin) + var(--stack-top-pad));           /* 単日モード: 1日分 + トップpad */
  }

  .bottom-sheet {
    bottom: var(--tab-bar-h); left: 0; width: 100%;
    border-radius: 0;       /* edge to edge */
    padding: 0;
    box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.6);
    border: none;
    border-top: 1px solid var(--line);
    /* --sheet-h で height を統一 (JS が単日/マルチで切替)。両方向に transition が効く */
    height: var(--sheet-h, 403px);
    transition: height 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    /* 新レイアウト: 地図と重ならないので背景を不透明に */
    background: var(--paper);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  /* 現地タブで ALT パネル展開時 (has-alt-openクラスは既存ロジックで付く) */
  body[data-single-day] .bottom-sheet.has-alt-open {
    height: var(--sheet-h-collapsed-alt, calc(var(--field-area-h) + 260px));
  }
  .day-text { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .day-text.weekday { color: var(--ink); }
  .day-text.weekend { color: var(--gold); }
  /* 1日の代表天気アイコン (日付の右側) */
  .day-summary-icon {
    font-size: 22px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
  }
  .day-temp { font-size: 20px; font-weight: 600; color: var(--ink-faint); letter-spacing: -0.02em; }
  .day-temp span { color: var(--ink); }

  /* === LOADING SKELETON — shown while forecast data is being fetched ===
     A subtle horizontal shimmer sweeps across placeholder bars to indicate
     the app is actively loading, without blocking the UI. */
  @keyframes shimmer {
    0%   { background-position: -200px 0; }
    100% { background-position: calc(200px + 100%) 0; }
  }
  
  /* === PULL-TO-REFRESH indicator ===
     A small spinner appears at the top of the sheet as the user pulls down.
     The bottom-sheet itself shifts down by --pull-distance so the user feels
     they are dragging it. */
  @keyframes ptr-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .ptr-indicator {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translate(-50%, calc(-100% + var(--pull-distance, 0px)));
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--paper-elev);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 10;
  }
  .bottom-sheet.is-pulling .ptr-indicator {
    opacity: 1;
    transition: none;
  }
  .ptr-indicator-arrow {
    width: 14px;
    height: 14px;
    color: var(--gold);
    transition: transform 0.2s ease;
  }
  .ptr-indicator.is-ready .ptr-indicator-arrow {
    transform: rotate(180deg);
  }
  .ptr-indicator.is-refreshing .ptr-indicator-arrow {
    animation: ptr-spin 0.8s linear infinite;
  }
  /* Pull-distance translation on the sheet itself */
  .bottom-sheet.is-pulling {
    transform: translateY(calc(var(--pull-distance, 0px) * -1));
    transition: none;
  }
  .bottom-sheet.is-snapping {
    transition: transform 0.25s ease;
    transform: translateY(0);
  }
  .skeleton-card {
    width: 100%;
    height: 168px;
    flex-shrink: 0;
    position: relative;
    border-bottom: 1px solid var(--line-soft);
    padding: 8px 16px;
    box-sizing: border-box;
  }
  .skeleton-bar {
    background: linear-gradient(
      90deg,
      rgba(240, 230, 210, 0.04) 0%,
      rgba(240, 230, 210, 0.10) 50%,
      rgba(240, 230, 210, 0.04) 100%
    );
    background-size: 200px 100%;
    background-repeat: no-repeat;
    border-radius: 4px;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  .skeleton-head {
    height: 14px;
    width: 100px;
    margin: 8px auto;
  }
  .skeleton-graph {
    height: 64px;
    width: calc(100% - 30px);
    margin: 8px auto;
    border-radius: 8px;
  }
  /* Hide skeleton once weekly-stack has any real .day-card children */
  .weekly-stack:has(.day-card) .skeleton-card {
    display: none;
  }

  /* === WEEKLY STACK — vertically scrollable list of day-cards + altitude panel === */
  .weekly-stack {
    flex: 1;
    min-height: var(--day-card-h, 129px);  /* always fit at least one full day-card row */
    padding-top: var(--stack-top-pad, 4px);
    /* 最終日カードを単日モードで上端まで scrollTop できるようにする余白 */
    padding-bottom: var(--stack-top-pad, 4px);
    overflow-y: hidden;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  /* Allow vertical overflow when the collapsed sheet is expanded by an alt
     panel — needed so the inline panel content is visible. */
  .bottom-sheet.has-alt-open .weekly-stack {
    overflow-y: visible;
  }
  /* ALT パネル展開中は、展開中の日カード (alt-open) 以外を非表示にして
     スクロールによる別日の表示を防ぐ */
  .bottom-sheet.has-alt-open .day-card:not(.alt-open) {
    display: none;
  }
  .weekly-stack::-webkit-scrollbar { display: none; }
  
  /* On wider screens, show day-cards in a multi-column grid:
       <  720px → 1 column  (mobile)
       720-1080 → 2 columns (tablet)
       ≥ 1080px → 3 columns (desktop)
     The altitude panel always spans the full width. */
  @media (min-width: 720px) {
    .weekly-stack {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: calc(var(--day-card-h, 129px) + var(--day-card-margin, 12px));
      align-content: start;
    }
  }
  @media (min-width: 1080px) {
    .weekly-stack {
      grid-template-columns: 1fr 1fr 1fr;
    }
  }
  
  /* One day-card per day: header (date + temp) + chart + time labels */
  .day-card {
    width: 100%;
    height: var(--day-card-h, 129px);  /* 36 header + 72 chart + 21 time-labels */
    flex-shrink: 0;
    position: relative;
    margin-bottom: var(--day-card-margin, 12px);
  }
  /* Vertical column borders between grid cells.
     Easier than nth-child arithmetic: render a right border on every cell,
     then remove it from cells that sit on the rightmost column. We can't
     reliably target the last column with CSS alone for variable counts, so
     we set the right border based on each layout's column count. */
  @media (min-width: 720px) {
    .day-card {
      border-right: 1px solid var(--line-soft);
    }
    /* Hide right border on the rightmost column (every 2nd card) for 2-col layout */
    .day-card:nth-child(2n) {
      border-right: none;
    }
  }
  @media (min-width: 1080px) {
    /* For 3-col layout, restore the right border on every card... */
    .day-card:nth-child(2n) {
      border-right: 1px solid var(--line-soft);
    }
    /* ...then hide it on every 3rd card (rightmost column) */
    .day-card:nth-child(3n) {
      border-right: none;
    }
  }
  .day-card:last-of-type { border-bottom: none; margin-bottom: 0; }
  
  /* day-card-head: center area (date + temp) is clickable for sheet toggle;
     alt-toggle button on the right opens/closes a per-day altitude panel. */
  .day-card-head {
    display: flex;
    align-items: center;
    width: 100%;
    height: 36px;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .day-card-head-center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    padding-left: 12px;
    height: 100%;
  }
  .alt-toggle {
    position: absolute;
    right: 12px;
    /* day-card-head の垂直中央 */
    top: 50%;
    transform: translateY(-50%);
    /* 日付文字高(20px)に合わせた外形 */
    padding: 3px 12px;
    /* コントラスト高めの枠 (透明度 0.15 → 0.4) */
    border: 1px solid rgba(240, 230, 210, 0.4);
    border-radius: 999px;
    background: rgba(13, 20, 38, 0.6);
    color: var(--ink-faint);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    z-index: 2;
    line-height: 1;
  }
  /* Expanded invisible tap target — extends 14px on each side so the button is
     easier to hit on touch devices without changing its visual size. */
  .alt-toggle::before {
    content: '';
    position: absolute;
    inset: -14px -14px -14px -14px;
  }
  .alt-toggle-label {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.12em;
  }
  .alt-toggle:hover {
    color: var(--ink);
    border-color: rgba(240, 230, 210, 0.3);
  }
  .day-card.alt-open .alt-toggle {
    color: var(--paper);
    border-color: var(--gold);
    background: var(--gold);
  }
  /* When alt panel is open, the day-card grows from fixed 128px to auto so
     the inline altitude panel fits below the chart. */
  .day-card.alt-open { height: auto; }
  /* Altitude panel uses the same transition curve and duration as the bottom
     sheet for visual consistency. Height is animated explicitly: JS sets it
     to the panel's content height on open and 0 on close. */
  .day-card-alt-panel {
    width: 100%;
    overflow: hidden;
    height: 0;
    transition: height 0.32s cubic-bezier(0.4, 0, 0.2, 1);
  }
  /* Inner wrapper provides horizontal padding without interfering with the
     parent's height animation. */
  .day-card-alt-panel-inner {
    padding: 8px 16px 12px;
  }

  .day-card-chart {
    position: relative;
    width: 100%;
    height: 132px;
  }

  /* Chart sub-region inside each day-card.
     Layout (top to bottom):
       0–58px   : wind speed + arrow (row 1)  +  weather icon (row 2)
       48–118px : chart canvas (graph area ~58px tall, 1.2× of previous)
       118–132px: time labels */
  .chart-region {
    position: relative;
    width: 100%;
    height: 72px;
    flex-shrink: 0;
  }

  /* 時刻ラベル - 各day-card直下 (Chart.jsのデータ点x座標に同期して絶対配置) */
  .day-card-time-labels {
    position: relative;
    /* 時刻テキストと下部罫線の間のパディング (⑥) */
    padding: 0 0 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-faint);
    line-height: 1;
    height: 21px;
    box-sizing: border-box;
    pointer-events: none;
  }
  .day-card-time-labels .time-label {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  /* 選択線の時刻ラベル領域への延長 (Y軸下端から時刻ラベル下端まで) */
  .day-card-time-labels .time-labels-sel-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1.5px;
    /* 破線を CSS で表現 (Chart.jsのsetLineDash([4,4])と同じピッチ) */
    background-image: linear-gradient(to bottom,
      rgba(255, 255, 255, 0.75) 0,
      rgba(255, 255, 255, 0.75) 4px,
      transparent 4px,
      transparent 8px);
    background-size: 100% 8px;
    background-repeat: repeat-y;
    transform: translateX(-50%);
    pointer-events: none;
    display: none;  /* JS で表示制御 */
  }
  .day-card-time-labels .time-labels-sel-line.visible {
    display: block;
  }
  /* 非選択日は半分の透過度 */
  .day-card-time-labels .time-labels-sel-line.dim {
    background-image: linear-gradient(to bottom,
      rgba(255, 255, 255, 0.35) 0,
      rgba(255, 255, 255, 0.35) 4px,
      transparent 4px,
      transparent 8px);
  }

  /* Wind info (weather icon + arrow + wind speed) at top of chart region.
     Two-row stack:
       Row 1: weather icon + direction arrow inline
       Row 2: wind speed */
  .wind-info-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 72px;
    pointer-events: none;
    z-index: 5;
  }
  .wind-info-col {
    position: absolute;
    top: 0;
    /* transform で x/y 両方をセンタリング (JSが top/left を設定) */
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    line-height: 1;
    white-space: nowrap;
    filter: drop-shadow(0 0 3px rgba(13, 20, 38, 0.9));
    pointer-events: auto;
    cursor: pointer;
    padding: 0 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .wind-info-col:active {
    transform: translate(-50%, -50%) scale(1.12);
    transition: transform 0.1s ease;
  }
  .wind-info-col .w-row1 {
    display: flex;
    align-items: center;
    gap: 4px;
    line-height: 1;
    font-size: 20px;
  }
  .wind-info-col .w-icon {
    font-size: 20px;
    line-height: 1;
  }
  .wind-info-col .w-arrow {
    font-size: 20px;
    color: var(--ink);
    line-height: 1;
  }
  .wind-info-col .w-speed {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-weight: 800;
    font-size: 23px;
    letter-spacing: -0.02em;
    line-height: 1.1;
    /* 風速テキストを点から上にオフセット (transform はレイアウトに影響せず
       指定 px がそのまま視覚移動になる) */
    transform: translateY(-4px);
  }

  /* 旧レイアウト: グラフ内の時刻ラベル(time-overlay)は非表示。
     新レイアウトでは day-card-time-labels (グラフ直下) を使うため。 */
  .time-overlay {
    display: none;
  }

  .chart-wrapper {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Y-axis labels are now drawn inside the chart canvas alongside day boundaries */

  /* === ALTITUDE PANEL (revealed on expand) === */
  .alt-list {
    list-style: none;
    margin: 0; padding: 0;
    overflow: hidden;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .alt-list li {
    display: grid;
    grid-template-columns: 60px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--line-soft);
    flex: 1;
    min-height: 0;
  }
  .alt-list li:last-child { border-bottom: none; }
  .alt-h {
    font-family: 'Inter', 'Noto Sans JP', sans-serif;
    font-size: 1rem;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1;
    color: var(--ink);
  }
  .alt-bar-track {
    height: 4px;
    background: rgba(240, 230, 210, 0.08);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .alt-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease, background 0.3s ease;
  }
  .alt-v {
    /* Match the top-right wind speed style for visual consistency */
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-weight: 800;
    font-size: 1.65rem;
    letter-spacing: -0.02em;
    line-height: 1;
    text-align: right;
    min-width: 60px;
  }
  .alt-v .u {
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-size: 0.6rem;
    color: var(--ink-faint);
    margin-left: 2px;
    font-weight: 600;
  }
  .alt-arr {
    /* グラフ上の風向アイコン (.w-arrow) と同じサイズ */
    font-size: 20px;
    width: 24px;
    text-align: center;
    color: var(--ink);
  }

  /* Data source attribution at bottom of sheet — visible only when expanded */
  .data-source {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--ink-faint);
    text-align: right;
    padding: 8px 16px 4px;
    flex-shrink: 0;
    letter-spacing: 0.04em;
    line-height: 1.4;
    display: none;  /* hidden when collapsed */
  }
  .data-source a {
    color: var(--ink-faint);
    text-decoration: none;
    border-bottom: 1px dotted rgba(240, 230, 210, 0.3);
    transition: color 0.15s, border-color 0.15s;
  }
  .data-source a:hover,
  .data-source a:active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  .leaflet-control-zoom { display: none; }
  .leaflet-control-attribution {
    background: rgba(255, 255, 255, 0.85) !important;
    color: rgba(60, 60, 60, 0.7) !important;
    font-size: 9px !important;
  }
  .leaflet-control-attribution a { color: rgba(60, 60, 60, 0.9) !important; }

  /* === REGISTER MODAL === */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--paper-elev);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    max-width: 360px; width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .modal h3 {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    margin: 0 0 4px;
    font-size: 1.2rem;
  }
  .modal .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-faint);
    margin-bottom: 14px;
  }
  .modal label {
    display: block;
    font-size: 0.75rem;
    color: var(--ink-faint);
    margin-bottom: 4px;
  }
  .modal input {
    width: 100%;
    padding: 10px 12px;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.9rem;
    margin-bottom: 12px;
  }
  .modal input:focus { outline: none; border-color: var(--gold); }
  .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .btn {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
  }

  /* === 単日/マルチデイ モードごとのシート挙動 === */
  /* マルチデイ表示中は 4日目以降を縦スクロール */
  body:not([data-single-day]) .weekly-stack {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* マルチデイ表示中は ALT ボタン非表示 (単日展開時のみ表示) */
  body:not([data-single-day]) .alt-toggle {
    display: none;
  }
  /* 日付ヘッダをタップ可能に (単日/マルチ切替) */
  .day-card-head {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease;
  }
  .day-card-head:active {
    background: rgba(224, 168, 80, 0.18);
  }
  /* (単日展開時、上のカードは消さずに残す。シート上端の降下が覆い隠す) */
  /* 閉じ開始のジャンプ段階: sheet/map/marker の transition を一時無効化して
     シート上端をタップカード直上まで瞬時移動 (上のカード+ベースを即座に地図が覆う) */
  body.snap-jump .bottom-sheet,
  body.snap-jump #map,
  body.snap-jump .center-marker {
    transition: none !important;
  }
</style>
</head>
<body>

  <div id="map"></div>
  <canvas id="windCanvas"></canvas>

  <div class="center-marker">
    <div class="pulse"></div>
    <div class="pulse"></div>
    <div class="pulse"></div>
    <div class="core"></div>
  </div>

  <div class="overlay top-bar" id="topBar">
    <div style="position: relative;">
      <div class="brand-mark">wind<span class="dot">.</span></div>
      <div class="location-name-wrapper" id="locationNameWrapper">
        <span class="location-name" id="locationName">フライトエリア</span>
        <svg class="dropdown-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
      <!-- Dropdown menu (hidden by default, shown when locationNameWrapper is tapped) -->
      <div class="location-dropdown" id="locationDropdown"></div>
    </div>
    <div class="current-weather">
      <div class="current-weather-main">
        <span class="wind-speed" id="topWindSpeed">4.5<small>m/s</small></span>
        <span class="wind-dir" id="topWindDir">↑</span>
      </div>
    </div>
  </div>

  <div class="fab-stack" id="fabStack">
    <button class="fab" id="fabRecenter" aria-label="観測地点に戻る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <line x1="12" y1="3" x2="12" y2="6"/>
        <line x1="12" y1="18" x2="12" y2="21"/>
        <line x1="3" y1="12" x2="6" y2="12"/>
        <line x1="18" y1="12" x2="21" y2="12"/>
        <circle cx="12" cy="12" r="2" fill="currentColor"/>
      </svg>
    </button>
    <button class="fab primary" id="fabRegister" aria-label="この地点を登録">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="overlay bottom-sheet" id="bottomSheet">
    <!-- Stacked weekly forecast: one day-card per day, then altitude panel at end.
         When sheet is collapsed, only the first day-card is visible (the rest are
         hidden via overflow). When expanded, the user can scroll vertically through
         the remaining 6 days plus the altitude profile. -->
    <!-- Pull-to-refresh indicator (shown when user drags sheet down past threshold) -->
    <div class="ptr-indicator" id="ptrIndicator">
      <svg class="ptr-indicator-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
    <div class="weekly-stack" id="weeklyStack">
      <!-- Initial loading skeleton — replaced by real day-cards once data loads -->
      <div class="skeleton-card">
        <div class="skeleton-bar skeleton-head"></div>
        <div class="skeleton-bar skeleton-graph"></div>
      </div>
    </div>

    <!-- Data source attribution — always visible at bottom of sheet -->
    <div class="data-source">
      <a href="https://www.jma.go.jp/jma/kishou/know/whitep/1-3-7.html" target="_blank" rel="noopener">気象庁 MSM</a>
    </div>
  </div>

  <div class="modal-backdrop" id="registerModal">
    <div class="modal">
      <h3>この地点を登録</h3>
      <div class="meta" id="modalCoord"></div>
      <label>地点名</label>
      <input type="text" id="pointName" placeholder="例: 坂東フィールド" maxlength="30">
      <div class="modal-actions">
        <button class="btn ghost" id="modalCancel">キャンセル</button>
        <button class="btn" id="modalSave">登録</button>
      </div>
    </div>
  </div>

  <!-- 新レイアウト: 画面最下部のタブバー (予報 / 現地) -->


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // === MAP ===
    const DEFAULT_LATLNG = [36.0479, 139.8979];
    const STORAGE_KEY = 'wind_paramotor_points_v1';
    
    const map = L.map('map', { zoomControl: false }).setView(DEFAULT_LATLNG, 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap, © CARTO'
    }).addTo(map);

    // === WIND FLOW PARTICLES (Windy-style overlay) ===
    const windFlow = (() => {
      const canvas = document.getElementById('windCanvas');
      const ctx = canvas.getContext('2d');
      let dpr = window.devicePixelRatio || 1;
      let width = 0, height = 0;
      let particles = [];
      const COUNT = 200;           // dense enough to always see flow on screen
      const TRAIL_FADE = 0.04;     // gentler fade for longer streaks
      let speed = 2.0;             // m/s
      let dir = 0;                 // meteorological "from" direction in degrees
      let rafId = null;
      let initialized = false;

      function resize() {
        // Use the canvas's own client dimensions — most reliable across mobile browsers
        const newW = canvas.clientWidth || window.innerWidth;
        const newH = canvas.clientHeight || window.innerHeight;
        if (Math.abs(newW - width) < 1 && Math.abs(newH - height) < 1 && initialized) {
          return false;
        }
        width = newW;
        height = newH;
        // Match canvas drawing buffer to its CSS size (1:1, no DPR scaling for simplicity)
        canvas.width = width;
        canvas.height = height;
        initialized = true;
        return true;
      }

      function spawn(p, freshArea) {
        // freshArea: if true, spawn anywhere; else spawn just upstream (off-screen)
        if (freshArea) {
          p.x = Math.random() * width;
          p.y = Math.random() * height;
        } else {
          // Determine which edge is upstream from current wind direction
          const toDir = (dir + 180) % 360;
          const rad = (toDir - 90) * Math.PI / 180;
          const dxSign = Math.cos(rad);
          const dySign = Math.sin(rad);
          if (Math.abs(dxSign) > Math.abs(dySign)) {
            p.x = dxSign > 0 ? -8 : width + 8;
            p.y = Math.random() * height;
          } else {
            p.x = Math.random() * width;
            p.y = dySign > 0 ? -8 : height + 8;
          }
        }
        p.life = 180 + Math.random() * 180;  // 180–360 frames ≈ 3–6 seconds at 60 fps
        p.age = Math.random() * p.life * 0.5;  // stagger ages on initial fill
      }

      function init() {
        resize();
        particles = [];
        for (let i = 0; i < COUNT; i++) {
          const p = {};
          spawn(p, true);
          particles.push(p);
        }
      }

      // Smoothly tween wind speed/direction over time so the visual transition
      // feels natural when the user changes the selected hour. We track target
      // values; the animation step interpolates current → target each frame.
      let targetSpeed = 0.3;
      let targetDir = 0;
      const SPEED_LERP = 0.04;  // per frame; ~25 frames (~0.4s) to converge
      const DIR_LERP = 0.06;
      
      function setWind(s, d) {
        targetSpeed = Math.max(0.3, s);
        // Wrap direction to the shortest path (e.g. 350° → 10° should go via 0°,
        // not the long way around)
        const cur = ((dir % 360) + 360) % 360;
        const tgt = ((d % 360) + 360) % 360;
        let delta = tgt - cur;
        if (delta > 180) delta -= 360;
        else if (delta < -180) delta += 360;
        targetDir = cur + delta;
        dir = cur;  // normalize current to 0..360 range so lerp works smoothly
      }

      function tickWindLerp() {
        speed += (targetSpeed - speed) * SPEED_LERP;
        dir   += (targetDir   - dir)   * DIR_LERP;
      }

      function colorForSpeed(s) {
        if (s >= 4.5) return 'rgba(235, 87, 87, ALPHA)';
        if (s >= 3.0) return 'rgba(224, 168, 80, ALPHA)';
        return 'rgba(92, 200, 138, ALPHA)';
      }

      function step() {
        if (width === 0 || height === 0) {
          rafId = requestAnimationFrame(step);
          return;
        }

        // Smoothly approach the target wind values each frame
        tickWindLerp();

        const toDir = (dir + 180) % 360;
        const rad = (toDir - 90) * Math.PI / 180;
        const pxPerFrame = 0.2 + speed * 0.2;
        const dx = Math.cos(rad) * pxPerFrame;
        const dy = Math.sin(rad) * pxPerFrame;

        // Fade trails
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = `rgba(0, 0, 0, ${TRAIL_FADE})`;
        ctx.fillRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'source-over';

        const baseColor = colorForSpeed(speed);
        ctx.lineCap = 'round';
        // Margin (in px) inside which particles fade in/out — keeps soft edges
        const FADE_MARGIN = Math.min(80, Math.min(width, height) * 0.15);

        for (const p of particles) {
          const oldX = p.x;
          const oldY = p.y;
          p.x += dx;
          p.y += dy;

          // Respawn ONLY when the particle has fully exited the canvas
          // (no life-based death — particles always traverse the whole screen)
          if (p.x < -10 || p.x > width + 10 || p.y < -10 || p.y > height + 10) {
            spawn(p, false);  // re-enter from upstream edge
            continue;
          }

          // Alpha fades softly near the four canvas edges so streaks don't
          // appear/disappear with hard cuts.
          const distLeft = p.x;
          const distRight = width - p.x;
          const distTop = p.y;
          const distBottom = height - p.y;
          const minEdge = Math.min(distLeft, distRight, distTop, distBottom);
          const edgeFade = Math.min(1, minEdge / FADE_MARGIN);
          const alpha = 0.7 * edgeFade;
          if (alpha <= 0) continue;

          ctx.strokeStyle = baseColor.replace('ALPHA', alpha.toFixed(2));
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(oldX, oldY);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }

        rafId = requestAnimationFrame(step);
      }

      function start() {
        if (rafId) cancelAnimationFrame(rafId);
        init();
        step();
      }

      // Handle viewport changes carefully: only re-spawn particles that fall outside,
      // never reset the canvas if dimensions haven't changed.
      function onViewportChange() {
        const changed = resize();
        if (changed) {
          // Bring stray particles back inside; keep their motion continuous
          for (const p of particles) {
            if (p.x < -10 || p.x > width + 10 || p.y < -10 || p.y > height + 10) {
              spawn(p, true);
            }
          }
        }
      }

      window.addEventListener('resize', onViewportChange);
      window.addEventListener('orientationchange', onViewportChange);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', onViewportChange);
      }
      // Re-fit shortly after first paint (mobile Chrome's address bar collapse, etc.)
      setTimeout(onViewportChange, 300);
      setTimeout(onViewportChange, 1000);

      // Page visibility: pause when hidden so trails don't decay to nothing on return
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
        } else if (!rafId) {
          step();
        }
      });

      return { start, setWind };
    })();
    windFlow.start();

    // === SAVED POINTS STATE ===
    // Each point: { id, name, lat, lon }
    let savedPoints = [];
    let activePointId = null;  // id of currently-selected saved point (or null = no saved point active)
    
    function loadSavedPoints() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            savedPoints = parsed;
            // Restore last-active if any was marked default
            const def = savedPoints.find(p => p.isDefault);
            if (def) activePointId = def.id;
          }
        }
      } catch (e) {
        console.warn('Failed to load saved points', e);
      }
    }
    function persistSavedPoints() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedPoints));
      } catch (e) { /* ignore */ }
    }
    
    // === LOCATION NAME UI ===
    const locationNameEl = document.getElementById('locationName');
    const locationNameWrapper = document.getElementById('locationNameWrapper');
    const locationDropdown = document.getElementById('locationDropdown');
    
    function getActivePoint() {
      return savedPoints.find(p => p.id === activePointId) || null;
    }
    
    function refreshTopBarName() {
      const active = getActivePoint();
      if (active) {
        locationNameEl.textContent = active.name;
      } else {
        locationNameEl.textContent = 'フライトエリア';
      }
      // Show dropdown caret only when there are 2+ saved points, OR
      // at least 1 saved point (so user can switch / view their list).
      if (savedPoints.length >= 1) {
        locationNameWrapper.classList.add('has-options');
      } else {
        locationNameWrapper.classList.remove('has-options');
      }
    }
    
    function refreshDropdownMenu() {
      if (savedPoints.length === 0) {
        locationDropdown.innerHTML = '';
        return;
      }
      locationDropdown.innerHTML = savedPoints.map(p => `
        <div class="location-option ${p.id === activePointId ? 'active' : ''}" data-id="${p.id}">
          <span class="location-option-name">${escapeHtml(p.name)}</span>
          <span class="location-option-delete" data-delete-id="${p.id}" title="削除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </span>
        </div>
      `).join('');
    }
    
    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
    
    function setActivePoint(id) {
      activePointId = id;
      // Mark default in stored data
      savedPoints.forEach(p => p.isDefault = (p.id === id));
      persistSavedPoints();
      refreshTopBarName();
      refreshDropdownMenu();
      const p = getActivePoint();
      if (p) {
        // Use saved zoom if present, otherwise fall back to a reasonable default
        const targetZoom = (typeof p.zoom === 'number') ? p.zoom : 13;
        map.flyTo([p.lat, p.lon], targetZoom, { duration: 0.6 });
        loadAndRefresh(p.lat, p.lon);
      }
    }
    
    function deletePoint(id) {
      const idx = savedPoints.findIndex(p => p.id === id);
      if (idx === -1) return;
      const wasActive = (id === activePointId);
      savedPoints.splice(idx, 1);
      persistSavedPoints();
      if (wasActive) {
        // Promote first remaining point if any
        if (savedPoints.length > 0) {
          setActivePoint(savedPoints[0].id);
        } else {
          activePointId = null;
          refreshTopBarName();
          refreshDropdownMenu();
        }
      } else {
        refreshTopBarName();
        refreshDropdownMenu();
      }
    }
    
    // Toggle dropdown when location name area is tapped (only if has options)
    locationNameWrapper.addEventListener('click', (e) => {
      if (!locationNameWrapper.classList.contains('has-options')) return;
      const open = locationDropdown.classList.toggle('show');
      locationNameWrapper.classList.toggle('open', open);
      e.stopPropagation();
    });
    
    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      if (!locationDropdown.contains(e.target) && !locationNameWrapper.contains(e.target)) {
        locationDropdown.classList.remove('show');
        locationNameWrapper.classList.remove('open');
      }
    });
    
    // Handle option clicks (delegate)
    locationDropdown.addEventListener('click', (e) => {
      const deleteEl = e.target.closest('[data-delete-id]');
      if (deleteEl) {
        e.stopPropagation();
        const id = deleteEl.getAttribute('data-delete-id');
        const p = savedPoints.find(pt => pt.id === id);
        if (p && confirm(`「${p.name}」を削除しますか？`)) {
          deletePoint(id);
        }
        return;
      }
      const optionEl = e.target.closest('[data-id]');
      if (optionEl) {
        const id = optionEl.getAttribute('data-id');
        setActivePoint(id);
        locationDropdown.classList.remove('show');
        locationNameWrapper.classList.remove('open');
      }
    });
    
    // === FAB: recenter ===
    document.getElementById('fabRecenter').addEventListener('click', () => {
      const active = getActivePoint();
      if (active) {
        const targetZoom = (typeof active.zoom === 'number') ? active.zoom : 13;
        map.flyTo([active.lat, active.lon], targetZoom, { duration: 0.6 });
      } else {
        map.flyTo(DEFAULT_LATLNG, 12, { duration: 0.6 });
      }
    });

    // === FAB: register modal ===
    const modal = document.getElementById('registerModal');
    const modalCoord = document.getElementById('modalCoord');
    document.getElementById('fabRegister').addEventListener('click', () => {
      const c = map.getCenter();
      modalCoord.textContent = `${c.lat.toFixed(4)}°N · ${c.lng.toFixed(4)}°E`;
      document.getElementById('pointName').value = '';
      modal.classList.add('show');
      setTimeout(() => document.getElementById('pointName').focus(), 50);
    });
    document.getElementById('modalCancel').addEventListener('click', () => modal.classList.remove('show'));
    document.getElementById('modalSave').addEventListener('click', () => {
      const name = document.getElementById('pointName').value.trim();
      if (!name) return;
      // Capture EXACT current map state at the moment of click — these values must
      // not be re-computed or re-derived elsewhere in this handler.
      const c = map.getCenter();
      const capturedZoom = map.getZoom();
      const capturedLat = parseFloat(c.lat.toFixed(4));
      const capturedLon = parseFloat(c.lng.toFixed(4));
      const id = 'pt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
      const newPoint = {
        id,
        name,
        lat: capturedLat,
        lon: capturedLon,
        zoom: capturedZoom
      };
      savedPoints.push(newPoint);
      // Make this point the active one without re-flying the map (which would
      // animate away from the user's current view and back, snapping zoom).
      activePointId = id;
      savedPoints.forEach(p => p.isDefault = (p.id === id));
      persistSavedPoints();
      refreshTopBarName();
      refreshDropdownMenu();
      // Fetch forecast for the captured coordinates (no map move)
      loadAndRefresh(capturedLat, capturedLon);
      modal.classList.remove('show');
    });
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

    // Update coord meta text live as map moves
    map.on('move', () => {
      const c = map.getCenter();
      const metaEl = document.getElementById('locationMeta');
      if (metaEl) metaEl.textContent =
        `${c.lat.toFixed(2)}°N · ${c.lng.toFixed(2)}°E`;
    });

    // === ドラッグ終了後、自動で中央地点の予報を取得 ===
    // - デバウンス 600ms: 連続操作中は発火しない
    // - 距離しきい値: 前回ロード座標とほぼ同じ (約 300m 未満) ならスキップ。
    //   シート開閉時の setView (毎フレーム) による moveend もこれで無視される。
    let moveEndTimer = null;
    map.on('moveend', () => {
      clearTimeout(moveEndTimer);
      moveEndTimer = setTimeout(() => {
        const c = map.getCenter();
        // loadAndRefresh 側の lastLoadedLat/Lon と比較 (未ロードなら必ず取得)
        try {
          if (lastLoadedLat != null && lastLoadedLon != null) {
            const dLat = Math.abs(c.lat - lastLoadedLat);
            const dLon = Math.abs(c.lng - lastLoadedLon);
            if (dLat < 0.003 && dLon < 0.003) return;  // ≈300m 未満の変化は無視
          }
          loadAndRefresh(c.lat, c.lng);
        } catch (e) { /* 初期化前なら次の moveend で処理 */ }
      }, 600);
    });
    
    // === BOOTSTRAP: restore saved state ===
    loadSavedPoints();
    refreshTopBarName();
    refreshDropdownMenu();
    // Determine initial coordinates: active saved point if any, else default
    const initialActive = getActivePoint();
    const initialLat = initialActive ? initialActive.lat : DEFAULT_LATLNG[0];
    const initialLon = initialActive ? initialActive.lon : DEFAULT_LATLNG[1];
    if (initialActive) {
      const initialZoom = (typeof initialActive.zoom === 'number') ? initialActive.zoom : 13;
      map.setView([initialActive.lat, initialActive.lon], initialZoom);
    }
    // Initial forecast load happens after the chart is initialized below.

    // === FORECAST DATA (Open-Meteo JMA MSM) ===
    const DAYS = 7;
    // 新レイアウト: 5時刻 (7:00 / 10:00 / 13:00 / 16:00 / 19:00) - 朝夕の凪重視
    const POINTS_PER_DAY = 5;
    // Alert when conditions enter the red zone (avg ≥ 4.5 m/s) or strong gust (≥ 6 m/s)
    const ALERT_THRESHOLD_GUST = 6.0;
    const ALERT_THRESHOLD_AVG = 4.5;
    const FORECAST_HOURS = [7, 10, 13, 16, 19];  // every 3h from 7 to 19 (paramotor-friendly)
    // Hours that get a visible label on the chart x-axis (others render blank)
    // 新レイアウト: 5時刻すべてラベル表示 (旧: 間引いて 7,11,15,19 のみ)
    const VISIBLE_LABEL_HOURS = new Set([7, 10, 13, 16, 19]);

    const dow = ['日', '月', '火', '水', '木', '金', '土'];

    // Live data arrays — filled by loadForecast()
    let dayLabels = [];
    let fullLabels = [];
    let fullTimestamps = [];
    let avgWindSpeeds = [];
    let maxWindSpeeds = [];
    let windDirs = [];
    let icons = [];
    let temps = [];
    // Pressure-level winds for altitude profile, keyed by timestamp index
    // Each item: { '1000hPa': {speed, dir}, '975hPa': {...}, ... }
    let altWindsByIndex = [];

    // Pressure level → approximate altitude AMSL (m) — JMA MSM standard levels
    const PRESSURE_LEVELS = [
      { hpa: 1000, alt: 110 },
      { hpa: 975,  alt: 320 },
      { hpa: 950,  alt: 500 },
      { hpa: 925,  alt: 800 },
      { hpa: 900,  alt: 1000 }
    ];

    // Altitude rows shown in the bottom sheet (high → low)
    // Each row maps to either: the surface 10m wind, or a pressure level's interpolated wind.
    const ALTITUDES = [
      { label: '980m',  source: 'pressure', hpa: 900 },
      { label: '780m',  source: 'pressure', hpa: 925 },
      { label: '480m',  source: 'pressure', hpa: 950 },
      { label: '300m',  source: 'pressure', hpa: 975 },
      { label: '90m',   source: 'pressure', hpa: 1000 },
      { label: '10m',   source: 'surface' }
    ];

    // === WMO weather codes → emoji + label ===
    function weatherInfo(code) {
      if (code == null) return { icon: '⛅', label: '不明' };
      if (code === 0) return { icon: '☀️', label: '快晴' };
      if (code === 1) return { icon: '🌤️', label: 'ほぼ晴' };
      if (code === 2) return { icon: '⛅', label: '晴 (雲あり)' };
      if (code === 3) return { icon: '☁️', label: '曇' };
      if (code >= 45 && code <= 48) return { icon: '🌫️', label: '霧' };
      if (code >= 51 && code <= 57) return { icon: '🌦️', label: '霧雨' };
      if (code >= 61 && code <= 67) return { icon: '🌧️', label: '雨' };
      if (code >= 71 && code <= 77) return { icon: '🌨️', label: '雪' };
      if (code >= 80 && code <= 82) return { icon: '🌧️', label: 'にわか雨' };
      if (code >= 85 && code <= 86) return { icon: '🌨️', label: 'にわか雪' };
      if (code >= 95) return { icon: '⛈️', label: '雷雨' };
      return { icon: '⛅', label: '曇' };
    }

    function altitudeProfileFor(idx) {
      const surfaceSpeed = avgWindSpeeds[idx];
      const surfaceDir = windDirs[idx];
      const ap = altWindsByIndex[idx] || {};
      return ALTITUDES.map((a) => {
        if (a.source === 'surface') {
          return { label: a.label, speed: surfaceSpeed, dir: surfaceDir };
        }
        const w = ap[a.hpa];
        if (w) {
          return { label: a.label, speed: w.speed, dir: w.dir };
        }
        // Fallback while data is loading
        return { label: a.label, speed: surfaceSpeed, dir: surfaceDir };
      });
    }

    // Speed bands — single source of truth for color, RGB triplet, and fill alpha.
    // Used by speedColor() (hex) and segment fill gradients (rgba).
    const SPEED_BANDS = [
      { min: 4.5, hex: '#eb5757', rgb: '235, 87, 87',  fillAlpha: 0.45 },  // alert red
      { min: 3.0, hex: '#e0a850', rgb: '224, 168, 80', fillAlpha: 0.35 },  // gold
      { min: 0.0, hex: '#5cc88a', rgb: '92, 200, 138', fillAlpha: 0.30 },  // calm green
    ];
    function speedBand(v) {
      for (const b of SPEED_BANDS) if (v >= b.min) return b;
      return SPEED_BANDS[SPEED_BANDS.length - 1];
    }
    function speedColor(v) { return speedBand(v).hex; }

    function windArrow(deg) {
      return `<span style="display:inline-block; transform: rotate(${deg + 180}deg);">↑</span>`;
    }

    // === FETCH DATA FROM OPEN-METEO ===
    // JMA MSM model is regional (Japan only) and provides hourly forecasts including
    // pressure-level winds (1000-100 hPa) up to ~33 hours ahead, plus seamless to 7d.
    async function loadForecast(lat, lon) {
      // Two API calls: MSM (high-res near-term incl. altitude) + seamless (7-day daily)
      const hourlyVars = [
        'temperature_2m',
        'wind_speed_10m',
        'wind_direction_10m',
        'wind_gusts_10m',
        'weather_code',
        'wind_speed_1000hPa', 'wind_direction_1000hPa',
        'wind_speed_975hPa',  'wind_direction_975hPa',
        'wind_speed_950hPa',  'wind_direction_950hPa',
        'wind_speed_925hPa',  'wind_direction_925hPa',
        'wind_speed_900hPa',  'wind_direction_900hPa',
      ].join(',');
      const msmUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&hourly=${hourlyVars}&models=jma_msm&wind_speed_unit=ms&timezone=Asia%2FTokyo&forecast_days=2`;
      const seamlessUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code` +
        `&models=jma_seamless&wind_speed_unit=ms&timezone=Asia%2FTokyo&forecast_days=7`;

      const [msmRes, seamlessRes] = await Promise.all([
        fetch(msmUrl).then(r => r.json()),
        fetch(seamlessUrl).then(r => r.json())
      ]);

      // Build a single 7-day x 6-time grid using:
      //   - MSM data for hours within MSM range (next ~33 hours)
      //   - Seamless data for the rest
      const msmHourly = msmRes.hourly || {};
      const seamlessHourly = seamlessRes.hourly || {};

      function findIndexAtHour(hourlyTimeArr, targetIso) {
        // Open-Meteo returns ISO timestamps like "2025-05-09T05:00"
        return hourlyTimeArr.indexOf(targetIso);
      }

      // Reset arrays
      dayLabels = [];
      fullLabels = [];
      fullTimestamps = [];
      avgWindSpeeds = [];
      maxWindSpeeds = [];
      windDirs = [];
      icons = [];
      temps = [];
      altWindsByIndex = [];

      const today = new Date();
      // Use Asia/Tokyo for date arithmetic (server already returns JST)
      for (let d = 0; d < DAYS; d++) {
        const date = new Date(today);
        date.setDate(today.getDate() + d);
        // 新レイアウト: "8/17 月" 形式(日付 → 曜日、括弧なし)
        dayLabels.push(`${date.getMonth() + 1}/${date.getDate()} ${dow[date.getDay()]}`);

        for (let h = 0; h < POINTS_PER_DAY; h++) {
          const hour = FORECAST_HOURS[h];
          const dt = new Date(date);
          dt.setHours(hour, 0, 0, 0);
          fullTimestamps.push(dt);
          fullLabels.push(String(hour));

          // ISO key in local JST format used by API time array
          const yyyy = dt.getFullYear();
          const mm = String(dt.getMonth() + 1).padStart(2, '0');
          const dd = String(dt.getDate()).padStart(2, '0');
          const hh = String(dt.getHours()).padStart(2, '0');
          const isoKey = `${yyyy}-${mm}-${dd}T${hh}:00`;

          // Prefer MSM
          let mIdx = findIndexAtHour(msmHourly.time || [], isoKey);
          let avgSpeed = null, gustSpeed = null, dir = null, code = null, temp = null;
          let altWinds = {};

          if (mIdx !== -1 && msmHourly.wind_speed_10m && msmHourly.wind_speed_10m[mIdx] != null) {
            avgSpeed = msmHourly.wind_speed_10m[mIdx];
            gustSpeed = msmHourly.wind_gusts_10m ? msmHourly.wind_gusts_10m[mIdx] : avgSpeed * 1.4;
            dir = msmHourly.wind_direction_10m[mIdx];
            code = msmHourly.weather_code ? msmHourly.weather_code[mIdx] : null;
            temp = msmHourly.temperature_2m ? msmHourly.temperature_2m[mIdx] : null;
            // Pressure-level winds
            for (const lv of PRESSURE_LEVELS) {
              const sKey = `wind_speed_${lv.hpa}hPa`;
              const dKey = `wind_direction_${lv.hpa}hPa`;
              if (msmHourly[sKey] && msmHourly[sKey][mIdx] != null) {
                altWinds[lv.hpa] = {
                  speed: msmHourly[sKey][mIdx],
                  dir: msmHourly[dKey][mIdx]
                };
              }
            }
          } else {
            // Fallback to seamless
            const sIdx = findIndexAtHour(seamlessHourly.time || [], isoKey);
            if (sIdx !== -1 && seamlessHourly.wind_speed_10m && seamlessHourly.wind_speed_10m[sIdx] != null) {
              avgSpeed = seamlessHourly.wind_speed_10m[sIdx];
              gustSpeed = seamlessHourly.wind_gusts_10m ? seamlessHourly.wind_gusts_10m[sIdx] : avgSpeed * 1.4;
              dir = seamlessHourly.wind_direction_10m[sIdx];
              code = seamlessHourly.weather_code ? seamlessHourly.weather_code[sIdx] : null;
              temp = seamlessHourly.temperature_2m ? seamlessHourly.temperature_2m[sIdx] : null;
            }
          }

          if (avgSpeed == null) avgSpeed = 0;
          if (gustSpeed == null) gustSpeed = avgSpeed * 1.3;
          if (dir == null) dir = 0;
          if (temp == null) temp = 0;

          avgWindSpeeds.push(parseFloat(avgSpeed.toFixed(1)));
          maxWindSpeeds.push(parseFloat(gustSpeed.toFixed(1)));
          windDirs.push(Math.round(dir));
          icons.push(weatherInfo(code).icon);
          temps.push(Math.round(temp));
          altWindsByIndex.push(altWinds);
        }
      }
    }

    // === WEEKLY STACK — per-day-card layout ===
    // Each day has its own Chart.js instance rendered inside its own day-card.
    // The cards are stacked vertically; only the first one is visible when the
    // sheet is collapsed. Tapping anywhere expands the sheet to reveal all 7 days.
    const weeklyStack = document.getElementById('weeklyStack');
    const dayCharts = [];
    const dayInfoOverlays = [];
    const dayTimeOverlays = [];
    const dayTimeLabels = [];  // 新レイアウト: 時刻ラベル要素の参照 (x 座標同期用)

    const GHOST_HOURS_BEFORE = 1.5;  // x軸範囲外に配置され、両端フェード表現のみに使用
    const GHOST_HOURS_AFTER  = 1.5;

    function dayPoints(values, dayIdx) {
      const start = dayIdx * POINTS_PER_DAY;
      const out = [];
      const first = values[start];
      const last  = values[start + POINTS_PER_DAY - 1];
      out.push({ x: FORECAST_HOURS[0] - GHOST_HOURS_BEFORE, y: first != null ? first : 0 });
      for (let h = 0; h < POINTS_PER_DAY; h++) {
        out.push({ x: FORECAST_HOURS[h], y: values[start + h] });
      }
      out.push({ x: FORECAST_HOURS[POINTS_PER_DAY - 1] + GHOST_HOURS_AFTER, y: last != null ? last : 0 });
      return out;
    }

    function isGhost(idx) {
      return idx === 0 || idx === POINTS_PER_DAY + 1;
    }
    function pointToRealHour(idx) { return idx - 1; }

    function buildSegmentGradient(ctx, baseRGB, alpha0, alpha1) {
      const p0 = ctx.p0, p1 = ctx.p1;
      if (!p0 || !p1) return `rgba(${baseRGB}, ${(alpha0 + alpha1) / 2})`;
      const canvasCtx = ctx.chart.ctx;
      const grad = canvasCtx.createLinearGradient(p0.x, 0, p1.x, 0);
      grad.addColorStop(0, `rgba(${baseRGB}, ${alpha0})`);
      grad.addColorStop(1, `rgba(${baseRGB}, ${alpha1})`);
      return grad;
    }
    // 塗り用: 垂直グラデーション (上=濃, 下=淡)。色相はベース色のまま維持し、
    // アルファ差でグラデーションを表現。視認性のため差を大きめに。
    function buildFillGradient(ctx, baseRGB, alpha0, alpha1) {
      const p0 = ctx.p0, p1 = ctx.p1;
      const chartArea = ctx.chart.chartArea;
      if (!p0 || !p1 || !chartArea) return `rgba(${baseRGB}, ${(alpha0 + alpha1) / 2})`;
      const canvasCtx = ctx.chart.ctx;
      const grad = canvasCtx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
      const midAlpha = (alpha0 + alpha1) / 2;
      // 上端: midAlpha × 1.8 (max 1.0 でクランプ、しっかり色が出る)
      // 下端: midAlpha × 0.5 (元の半分)
      const topAlpha = Math.min(1, midAlpha * 1.8);
      const bottomAlpha = midAlpha * 0.5;
      grad.addColorStop(0, `rgba(${baseRGB}, ${topAlpha.toFixed(3)})`);
      grad.addColorStop(1, `rgba(${baseRGB}, ${bottomAlpha.toFixed(3)})`);
      return grad;
    }
    function segmentEndpointAlphas(p0Idx, p1Idx, baseAlpha) {
      const a0 = isGhost(p0Idx) ? 0 : baseAlpha;
      const a1 = isGhost(p1Idx) ? 0 : baseAlpha;
      return [a0, a1];
    }

    // Returns a Chart.js scriptable callback that gives the dot color for a day's
    // chart — transparent for ghost endpoints, speed-band color for real points.
    function pointColorFor(dayIdx) {
      return (ctx) => {
        if (isGhost(ctx.dataIndex)) return 'rgba(0,0,0,0)';
        const realIdx = dayIdx * POINTS_PER_DAY + pointToRealHour(ctx.dataIndex);
        return speedColor(avgWindSpeeds[realIdx] || 0);
      };
    }

    // Per-day overlay-sync plugin: positions wind-info and time-col elements
    // to match each chart's data point x-coordinates. Runs after each draw so
    // the overlay always matches Chart.js's internal layout (no race conditions).
    function makeOverlaySyncPlugin(dayIdx) {
      return {
        id: `overlaySync_${dayIdx}`,
        afterDraw: (chart) => {
          const meta = chart.getDatasetMeta(0);
          if (!meta || !meta.data || meta.data.length === 0) return;
          const infoOverlay = dayInfoOverlays[dayIdx];
          if (!infoOverlay) return;
          const infos = infoOverlay.querySelectorAll('.wind-info-col');
          const timeLabelsEl = dayTimeLabels[dayIdx];
          const timeSpans = timeLabelsEl ? timeLabelsEl.querySelectorAll('.time-label') : [];
          // 新レイアウト: オーバーレイを各データ点に重ねる
          // 上=風速、下=天気+風向 が点を挟む形になる
          for (let h = 0; h < POINTS_PER_DAY; h++) {
            const point = meta.data[h + 1];
            if (!point) continue;
            const px = point.x;
            const py = point.y;
            if (px <= 0) continue;
            if (infos[h]) {
              infos[h].style.left = px + 'px';
              infos[h].style.top = py + 'px';
            }
            if (timeSpans[h]) {
              timeSpans[h].style.left = px + 'px';
            }
          }
        }
      };
    }

    // Draw text with a dark halo (background outline) for readability against
    // the chart's gradient fill. Halo color is the page bg; main color is passed in.
    function fillTextWithHalo(ctx, text, x, y, mainColor) {
      ctx.fillStyle = 'rgba(13, 20, 38, 0.95)';
      ctx.fillText(text, x - 1, y);
      ctx.fillText(text, x + 1, y);
      ctx.fillText(text, x, y - 1);
      ctx.fillText(text, x, y + 1);
      ctx.fillStyle = mainColor;
      ctx.fillText(text, x, y);
    }

    // Y軸主軸線の上端 y 座標を求める (最上位に描画されるY軸ラベルの文字上端に揃える)。
    // makeDayBoundaryPlugin と 破線プラグイン(選択線・現在時刻線)の両方で使用。
    function computeYAxisTop(chart) {
      const yScale = chart.scales && chart.scales.y;
      const chartArea = chart.chartArea;
      if (!yScale || !chartArea) return 0;
      const step = pickYStep(yScale.max);
      let topLabelVal = 0;
      for (let v = Math.floor(yScale.max / step) * step; v >= step; v -= step) {
        if (v <= 0 || v > yScale.max) continue;
        topLabelVal = v;
        break;
      }
      const FONT_H = 13;  // Y軸ラベルフォントの高さ (makeDayBoundaryPlugin と一致)
      return topLabelVal > 0
        ? yScale.getPixelForValue(topLabelVal) - FONT_H / 2
        : chartArea.top;
    }

    // Per-day plugin: draws horizontal grid + Y-axis labels + primary axes + m/s unit
    function makeDayBoundaryPlugin(dayIdx) {
      const AXIS_PAD = 2;  // 主軸と折れ線/塗りの間のマージン (px)
      const Y_LABEL_X_OFFSET = 8;   // Y軸線から左へのオフセット(Y軸ラベルの右端位置)
      const AXIS_COLOR = 'rgba(240, 230, 210, 0.25)';
      const GRID_COLOR = 'rgba(240, 230, 210, 0.08)';
      const LABEL_COLOR = '#8a7e62';  // 時刻ラベルと同じ --ink-faint 色
      return {
        id: `dayBoundary_${dayIdx}`,
        beforeDraw: (chart) => {
          const {ctx, chartArea} = chart;
          const yScale = chart.scales.y;
          if (!yScale || !chartArea) return;
          // Y軸線は chartArea.left から AXIS_PAD 分左にオフセット
          // (折れ線・塗りは chartArea 内に描画されるので、主軸との間に AXIS_PAD の余白ができる)
          const Y_AXIS_X = Math.round(chartArea.left - AXIS_PAD) + 0.5;
          const step = pickYStep(yScale.max);
          ctx.save();
          // グリッド線 + Y軸ラベル (Y軸のすぐ左に配置)
          ctx.font = "600 13px 'Inter', sans-serif";
          ctx.textBaseline = 'middle';
          ctx.textAlign = 'right';
          for (let v = Math.floor(yScale.max / step) * step; v >= step; v -= step) {
            // v が 0 なら別途最下位ラベルとして描画するのでスキップ、
            // v が yScale.max を超えている場合のみスキップ (== max は描画対象)
            if (v <= 0 || v > yScale.max) continue;
            const y = yScale.getPixelForValue(v);
            ctx.beginPath();
            ctx.strokeStyle = GRID_COLOR;
            ctx.lineWidth = 1;
            // グリッド線は Y軸線から chartArea.right まで
            ctx.moveTo(Y_AXIS_X, y);
            ctx.lineTo(chartArea.right, y);
            ctx.stroke();
            fillTextWithHalo(ctx, String(v), Y_AXIS_X - Y_LABEL_X_OFFSET, y, LABEL_COLOR);
          }
          // Y軸原点 (0) ラベル: X軸線の位置に描画
          const y0 = yScale.getPixelForValue(0);
          fillTextWithHalo(ctx, '0', Y_AXIS_X - Y_LABEL_X_OFFSET, y0, LABEL_COLOR);
          // 一番上に描画されるY軸ラベル値を求め、その文字上端に Y軸線の上端を揃える
          const yAxisTop = computeYAxisTop(chart);
          // Y軸縦線 (最上位ラベル文字上端 → X軸線位置)
          // X軸線は chartArea.bottom から AXIS_PAD 分下にオフセット
          const xAxisY = Math.round(chartArea.bottom + AXIS_PAD) + 0.5;
          ctx.beginPath();
          ctx.strokeStyle = AXIS_COLOR;
          ctx.lineWidth = 1;
          ctx.moveTo(Y_AXIS_X, yAxisTop);
          ctx.lineTo(Y_AXIS_X, xAxisY);
          // X軸ベースライン (Y軸線から chartArea.right まで)
          ctx.moveTo(Y_AXIS_X, xAxisY);
          ctx.lineTo(chartArea.right, xAxisY);
          ctx.stroke();
          ctx.restore();
        }
      };
    }

    let selectionAnimStart = 0;
    function triggerSelectionAnim() {
      selectionAnimStart = performance.now();
      requestAnimationFrame(function tick() {
        for (const c of dayCharts) if (c) c.draw();
        const elapsed = performance.now() - selectionAnimStart;
        if (elapsed < 1400) requestAnimationFrame(tick);
      });
    }
    function makeSelectionPlugin(dayIdx) {
      return {
        id: `selectionLine_${dayIdx}`,
        afterDatasetsDraw: (chart) => {
          if (selectedIndex == null || selectedIndex < 0) return;
          const selDay = Math.floor(selectedIndex / POINTS_PER_DAY);
          const selH = selectedIndex % POINTS_PER_DAY;
          const isSelectedDay = (selDay === dayIdx);
          // time-labels-sel-line は自身の day-card のものを制御
          const timeLabelsEl = dayTimeLabels[dayIdx];
          const selLineExt = timeLabelsEl ? timeLabelsEl.querySelector('.time-labels-sel-line') : null;
          // 選択日以外は縦線を描画せず、time-labels の延長線も非表示に
          if (!isSelectedDay) {
            if (selLineExt) selLineExt.classList.remove('visible');
            return;
          }
          const meta = chart.getDatasetMeta(0);
          const point = meta.data[selH + 1];
          if (!point) return;
          const {ctx, chartArea} = chart;
          if (!chartArea) return;
          ctx.save();
          // 縦線: Y軸主軸線の上端 (最上位ラベル文字上端) から下端 (chartArea.bottom) まで
          const selTopY = computeYAxisTop(chart);
          ctx.beginPath();
          ctx.setLineDash([4, 4]);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
          ctx.lineWidth = 1.5;
          ctx.moveTo(point.x, selTopY);
          ctx.lineTo(point.x, chartArea.bottom);
          ctx.stroke();
          ctx.setLineDash([]);
          // ドット強調 (halo + アニメリング)
          const elapsed = performance.now() - selectionAnimStart;
          const dotRadius = 5;
          if (elapsed < 700) {
            const t = Math.min(1, elapsed / 700);
            const eased = 1 - Math.pow(1 - t, 3);
            const ringRadius = dotRadius + 2 + eased * 14;
            const alpha = (1 - t) * 0.9;
            ctx.beginPath();
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.lineWidth = 2;
            ctx.arc(point.x, point.y, ringRadius, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.lineWidth = 2;
          ctx.arc(point.x, point.y, dotRadius + 4, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
          // time-labels エリアへの延長線 (選択日のみ)
          if (selLineExt) {
            selLineExt.style.left = point.x + 'px';
            selLineExt.classList.add('visible');
            selLineExt.classList.remove('dim');
          }
        }
      };
    }

    // 単日モードで、その日が今日 (dayIdx=0) の場合のみ現在時刻縦線を描画
    function makeCurrentTimePlugin(dayIdx) {
      return {
        id: `currentTime_${dayIdx}`,
        afterDatasetsDraw(chart) {
          // 当日 (dayIdx=0) のカードでのみ描画。単日/マルチデイどちらのモードでも表示。
          if (dayIdx !== 0) return;
          const now = new Date();
          const h = now.getHours() + now.getMinutes() / 60;
          const firstHour = FORECAST_HOURS[0];
          const lastHour = FORECAST_HOURS[POINTS_PER_DAY - 1];
          if (h < firstHour || h > lastHour) return;
          const { ctx, chartArea, scales } = chart;
          if (!scales || !scales.x || !scales.y || !chartArea) return;
          const x = scales.x.getPixelForValue(h);
          ctx.save();
          // 破線縦線 (Y軸主軸線の上端 〜 chartArea.bottom)
          const nowTopY = computeYAxisTop(chart);
          ctx.setLineDash([2, 2]);
          ctx.strokeStyle = 'rgba(224, 168, 80, 0.85)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, nowTopY);
          ctx.lineTo(x, chartArea.bottom);
          ctx.stroke();
          ctx.setLineDash([]);
          // 現在の風速を線形補間して y 座標を得る
          const dayStart = dayIdx * POINTS_PER_DAY;
          let idx0 = 0, idx1 = 1;
          for (let i = 0; i < POINTS_PER_DAY - 1; i++) {
            if (h >= FORECAST_HOURS[i] && h <= FORECAST_HOURS[i + 1]) {
              idx0 = i; idx1 = i + 1; break;
            }
          }
          const t = (h - FORECAST_HOURS[idx0]) / (FORECAST_HOURS[idx1] - FORECAST_HOURS[idx0]);
          const s0 = avgWindSpeeds[dayStart + idx0];
          const s1 = avgWindSpeeds[dayStart + idx1];
          if (s0 == null || s1 == null) { ctx.restore(); return; }
          const currentSpeed = s0 * (1 - t) + s1 * t;
          const y = scales.y.getPixelForValue(currentSpeed);
          // halo + ドット
          ctx.fillStyle = 'rgba(224, 168, 80, 0.25)';
          ctx.beginPath();
          ctx.arc(x, y, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#e0a850';
          ctx.strokeStyle = '#f0e6d2';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(x, y, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
      };
    }

    function buildDayCard(dayIdx) {
      const card = document.createElement('div');
      card.className = 'day-card';
      card.dataset.dayIdx = dayIdx;
      const daySlice = temps.slice(dayIdx * POINTS_PER_DAY, (dayIdx + 1) * POINTS_PER_DAY);
      const dayMaxTemp = Math.round(Math.max(...daySlice));
      const dayMinTemp = Math.round(Math.min(...daySlice));
      // 曜日が土日かどうか判定 (今日=day0を基準に日数加算)
      const cardDate = new Date();
      cardDate.setDate(cardDate.getDate() + dayIdx);
      const dow = cardDate.getDay();
      const weekendClass = (dow === 0 || dow === 6) ? 'weekend' : 'weekday';
      // 1日の代表天気アイコン (13:00 = hour index 2 の天気)
      const dayIconIdx = dayIdx * POINTS_PER_DAY + 2;
      const dayIcon = icons[dayIconIdx] || '';
      const head = document.createElement('div');
      head.className = 'day-card-head';
      head.innerHTML = `
        <span class="day-card-head-center">
          <span class="day-text ${weekendClass}">${dayLabels[dayIdx]}</span>
          <span class="day-summary-icon">${dayIcon}</span>
          <span class="day-temp"><span>${dayMaxTemp}</span>°/${dayMinTemp}°</span>
        </span>
        <button class="alt-toggle" type="button" aria-label="高度別予測を表示">
          <span class="alt-toggle-label">ALT</span>
        </button>
      `;
      card.appendChild(head);

      // Tap handlers:
      //   - head center (date + temp): toggles sheet expansion / day selection
      //   - alt-toggle button: toggles per-day altitude panel inline (doesn't
      //     close the sheet)
      //   - chart area: dot selection takes priority
      // ヘッダタップは document レベルの共通リスナーで処理
      // (単日/マルチ切替 + ALT展開中はALTクローズ)

      // Altitude toggle button — opens/closes the inline altitude panel for this day
      const altBtn = head.querySelector('.alt-toggle');
      altBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleDayAltPanel(card, dayIdx);
      });

      const chartRegion = document.createElement('div');
      chartRegion.className = 'day-card-chart chart-region';
      const infoOverlay = document.createElement('div');
      infoOverlay.className = 'wind-info-overlay';
      chartRegion.appendChild(infoOverlay);
      dayInfoOverlays[dayIdx] = infoOverlay;
      const wrapper = document.createElement('div');
      wrapper.className = 'chart-wrapper';
      const canvas = document.createElement('canvas');
      wrapper.appendChild(canvas);
      chartRegion.appendChild(wrapper);
      const timeOverlay = document.createElement('div');
      timeOverlay.className = 'time-overlay';
      chartRegion.appendChild(timeOverlay);
      dayTimeOverlays[dayIdx] = timeOverlay;
      card.appendChild(chartRegion);
      
      // 新レイアウト: 時刻ラベルを day-card 直下に配置 (x 座標はChart.jsのデータ点に同期)
      const timeLabelsEl = document.createElement('div');
      timeLabelsEl.className = 'day-card-time-labels';
      // 選択線の time-labels エリアへの延長用要素 (JS で位置とvisibility制御)
      const selLineExt = document.createElement('div');
      selLineExt.className = 'time-labels-sel-line';
      timeLabelsEl.appendChild(selLineExt);
      for (let h = 0; h < POINTS_PER_DAY; h++) {
        const t = document.createElement('span');
        t.className = 'time-label';
        t.textContent = `${FORECAST_HOURS[h]}:00`;
        timeLabelsEl.appendChild(t);
      }
      card.appendChild(timeLabelsEl);
      dayTimeLabels[dayIdx] = timeLabelsEl;
      
      weeklyStack.appendChild(card);

      for (let h = 0; h < POINTS_PER_DAY; h++) {
        const i = dayIdx * POINTS_PER_DAY + h;
        const speed = avgWindSpeeds[i];
        const hour = FORECAST_HOURS[h];
        const infoEl = document.createElement('div');
        infoEl.className = 'wind-info-col';
        infoEl.dataset.idx = i;
        infoEl.innerHTML = `
          <span class="w-speed" style="color:${speedColor(speed)}">${speed.toFixed(1)}</span>
          <span class="w-row1">
            <span class="w-icon">${icons[i] || ''}</span>
            <span class="w-arrow">${windArrow(windDirs[i])}</span>
          </span>
        `;
        infoEl.addEventListener('click', (e) => {
          e.stopPropagation();
          updateSelection(i);
        });
        infoOverlay.appendChild(infoEl);

        const timeEl = document.createElement('div');
        timeEl.className = 'time-col';
        if (VISIBLE_LABEL_HOURS.has(hour)) {
          timeEl.textContent = String(hour).padStart(2, '0') + ':00';
        }
        timeOverlay.appendChild(timeEl);
      }

      const chart = new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
          datasets: [
            {
              data: dayPoints(avgWindSpeeds, dayIdx),
              // clip: true — 折れ線グラフはX主軸範囲内で完結。Ghost点への線分はchartArea外でクリップ
              // (フェードアウトは chartArea 内で完結する)
              clip: true,
              borderColor: '#f0e6d2',
              backgroundColor: 'rgba(240, 230, 210, 0.15)',
              borderWidth: 2, fill: 'origin', tension: 0.4,
              pointBackgroundColor: pointColorFor(dayIdx),
              pointBorderColor: pointColorFor(dayIdx),
              pointRadius: (ctx) => {
                if (isGhost(ctx.dataIndex)) return 0;
                const realIdx = dayIdx * POINTS_PER_DAY + pointToRealHour(ctx.dataIndex);
                return realIdx === selectedIndex ? 5 : 3;
              },
              pointHitRadius: (ctx) => isGhost(ctx.dataIndex) ? 0 : 25,
              parsing: false,
              segment: {
                borderColor: (ctx) => {
                  const [a0, a1] = segmentEndpointAlphas(ctx.p0DataIndex, ctx.p1DataIndex, 1);
                  return buildSegmentGradient(ctx, '240, 230, 210', a0, a1);
                },
                backgroundColor: (ctx) => {
                  // Use whichever endpoint is a real data point; ghosts have no value
                  let realIdx = -1;
                  if (!isGhost(ctx.p0DataIndex)) realIdx = dayIdx * POINTS_PER_DAY + pointToRealHour(ctx.p0DataIndex);
                  else if (!isGhost(ctx.p1DataIndex)) realIdx = dayIdx * POINTS_PER_DAY + pointToRealHour(ctx.p1DataIndex);
                  const v = realIdx >= 0 ? avgWindSpeeds[realIdx] : 0;
                  const band = speedBand(v);
                  const [a0, a1] = segmentEndpointAlphas(ctx.p0DataIndex, ctx.p1DataIndex, band.fillAlpha);
                  return buildFillGradient(ctx, band.rgb, a0, a1);
                }
              }
            }
          ]
        },
        options: {
          // 新レイアウト: 左右パディング 16px で対称、top 0 (③指定), bottom 0
          layout: { padding: { left: 18, right: 16, top: 7, bottom: 2 } },
          responsive: true, maintainAspectRatio: false,
          // resize / 更新時のアニメーションを無効化 (シート開閉時の "右伸び" 対策)
          animation: false,
          animations: { colors: false, x: false, y: false },
          transitions: { active: { animation: { duration: 0 } }, resize: { animation: { duration: 0 } } },
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: {
            x: {
              type: 'linear',
              // x軸範囲を実データ点範囲より広げる → chartArea 内で 7:00 と 19:00 が
              // 左右16pxずつ内側に配置される (day-card幅約360px、chartArea≈328px、1単位≈27.3pxを想定)
              // 12単位 (実データ) + 両側 0.6 単位 (16px相当) = 13.2 単位
              min: FORECAST_HOURS[0] - 0.6,
              max: FORECAST_HOURS[POINTS_PER_DAY - 1] + 0.6,
              grid: { display: false },
              ticks: { display: false }
            },
            y: {
              grid: { display: false, drawBorder: false },
              ticks: { display: false, stepSize: 2 },
              min: 0, max: 6
            }
          },
          interaction: { mode: 'nearest', axis: 'x', intersect: false },
          onClick: (e, activeEls) => {
            if (activeEls.length === 0) return;
            const dsIdx = activeEls[0].index;
            if (isGhost(dsIdx)) return;
            const realIdx = dayIdx * POINTS_PER_DAY + pointToRealHour(dsIdx);
            updateSelection(realIdx);
          }
        },
        plugins: [makeDayBoundaryPlugin(dayIdx), makeSelectionPlugin(dayIdx), makeOverlaySyncPlugin(dayIdx), makeCurrentTimePlugin(dayIdx)]
      });
      dayCharts[dayIdx] = chart;
    }

    // Overlay sync is handled per-chart by makeOverlaySyncPlugin (afterDraw hook).
    // This function is a fallback that just triggers a redraw on all charts so
    // the plugin runs again — useful after resize / data reload events.
    function syncOverlayPositions() {
      for (const c of dayCharts) if (c) c.draw();
    }

    function renderWeeklyStack() {
      weeklyStack.innerHTML = '';
      for (const c of dayCharts) if (c) c.destroy();
      dayCharts.length = 0;
      dayInfoOverlays.length = 0;
      dayTimeOverlays.length = 0;
      dayTimeLabels.length = 0;
      // 常に全 7 日をレンダし、単日モードでは CSS で選択日以外を非表示に。
      // これによりモード切替時に DOM 再構築不要になり、height transition が滑らか。
