<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>wind.</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d1426">
<meta name="description" content="パラモーター向け風況モニター - 気象庁MSM">

<!-- iOS Web App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="wind.">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<!-- Standard favicon -->
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root, [data-theme="dark"] {
    --paper: #0d1426;
    --paper-elev: #16213d;
    --paper-overlay: rgba(13, 20, 38, 0.9);
    --paper-solid: rgba(13, 20, 38, 0.96);
    --ink: #f0e6d2;
    --ink-faint: #8a7e62;
    --gold: #e0a850;
    --green: #5cc88a;
    --alert: #eb5757;
    --line: rgba(240, 230, 210, 0.15);
    --line-soft: rgba(240, 230, 210, 0.08);
    --bg-alt: rgba(255, 255, 255, 0.06);
  }

  * { box-sizing: border-box; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--paper); color: var(--ink);
    font-family: 'Inter', 'Noto Sans JP', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  #map {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    background: #e8eef0;
  }

  /* Wind flow particles canvas — pinned to viewport, sits above map tiles, below all overlays */
  #windCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 3;
    pointer-events: none;
  }

  .overlay {
    position: absolute; z-index: 10;
    background: var(--paper-overlay);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
  }

  /* === TOP BAR — edge-to-edge, no rounded corners === */
  .top-bar {
    top: 0;
    left: 0;
    right: 0;
    border-radius: 0;
    border: none;
    border-bottom: 1px solid var(--line);
    /* Account for iOS notch via safe-area, but visually flush to edges */
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }
  /* Alert state — only the badge appears; no bar background or pulse animation */
  .brand-mark { font-family: 'DM Serif Display', serif; font-size: 18px; font-style: italic; }
  .brand-mark .dot { color: var(--gold); }
  
  /* Location name — clickable when more than one saved point */
  .location-name-wrapper {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--ink);
    cursor: default;
    padding: 2px 0;
    user-select: none;
    -webkit-user-select: none;
  }
  .location-name-wrapper.has-options {
    cursor: pointer;
  }
  .location-name-wrapper.has-options:active {
    opacity: 0.7;
  }
  .location-name { font-weight: 700; font-size: 0.95rem; }
  .dropdown-caret {
    display: none;
    width: 10px;
    height: 10px;
    color: var(--ink-faint);
    transition: transform 0.2s;
  }
  .location-name-wrapper.has-options .dropdown-caret { display: inline-block; }
  .location-name-wrapper.open .dropdown-caret { transform: rotate(180deg); }
  
  .location-meta { font-size: 0.6rem; color: var(--ink-faint); font-family: monospace; }
  
  /* Dropdown menu — shown when location is tapped (with multiple saved points) */
  .location-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 1px;
    min-width: 200px;
    max-width: 300px;
    background: var(--paper-elev, #16213d);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    z-index: 50;
    display: none;
    overflow: hidden;
  }
  .location-dropdown.show { display: block; }
  .location-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line-soft, rgba(240, 230, 210, 0.06));
    transition: background 0.1s;
  }
  .location-option:last-child { border-bottom: none; }
  .location-option:active,
  .location-option.active {
    background: rgba(224, 168, 80, 0.12);
  }
  .location-option-name {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .location-option.active .location-option-name {
    color: var(--gold);
  }
  .location-option-delete {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint);
    border-radius: 50%;
    flex-shrink: 0;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .location-option-delete:active,
  .location-option-delete:hover {
    background: rgba(235, 87, 87, 0.15);
    color: var(--alert);
  }
  .location-option-delete svg {
    width: 14px; height: 14px;
    stroke-width: 2;
  }

  .current-weather { text-align: right; }
  .current-weather-main {
    display: flex;
    align-items: baseline;
    gap: 6px;
    color: var(--ink);
    justify-content: flex-end;
    line-height: 1;
  }
  .wind-dir {
    font-size: 1.4rem;
    display: inline-block;
    transition: transform 0.3s ease;
    align-self: center;
  }
  .wind-speed {
    font-size: 2.6rem;
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.03em;
    font-family: 'DM Serif Display', serif;
    font-style: italic;
  }
  .wind-speed small {
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--ink-faint);
    margin-left: 2px;
  }
  .current-weather-sub {
    font-family: 'JetBrains Mono', 'Inter', monospace;
    font-size: 0.7rem;
    color: var(--gold);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-top: 6px;
  }
  /* === CENTER PULSE MARKER === */
  .center-marker {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    pointer-events: none;
    width: 80px; height: 80px;
  }
  .center-marker .pulse {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.7;
    animation: pulse 2s ease-out infinite;
  }
  .center-marker .pulse:nth-child(2) { animation-delay: 0.6s; }
  .center-marker .pulse:nth-child(3) { animation-delay: 1.2s; }
  @keyframes pulse {
    0% { width: 16px; height: 16px; opacity: 0.7; }
    100% { width: 80px; height: 80px; opacity: 0; }
  }
  .center-marker .core {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.5);
  }

  /* === FLOATING ACTION BUTTONS === */
  .fab-stack {
    position: absolute;
    z-index: 8;
    right: 12px;
    bottom: calc(var(--sheet-h, 130px) + 12px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: bottom 0.32s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .fab {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--paper-overlay);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: transform 0.15s ease;
    font-size: 18px;
    line-height: 1;
    padding: 0;
  }
  .fab:active { transform: scale(0.92); }
  .fab.primary { color: var(--gold); }
  .fab svg { width: 20px; height: 20px; }

  /* === BOTTOM SHEET — edge to edge, no rounded corners, no handle === */
  :root { --sheet-collapsed-h: 130px; --sheet-expanded-h: 380px; }

  .bottom-sheet {
    bottom: 0; left: 0; width: 100%;
    border-radius: 0;       /* edge to edge */
    /* No bottom padding when collapsed — sheet height matches the day-card. */
    padding: 0;
    box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.6);
    border: none;
    border-top: 1px solid var(--line);
    height: var(--sheet-collapsed-h);
    transition: height 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .bottom-sheet.expanded {
    height: var(--sheet-expanded-h);
    /* When expanded, add bottom padding so content doesn't sit under the
       Android gesture bar / iOS home indicator. */
    padding: 0 0 max(env(safe-area-inset-bottom, 0px), 32px);
  }

  .day-text { font-size: 0.95rem; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
  .summary-icon { font-size: 1rem; }
  .day-temp { font-size: 0.75rem; font-weight: 600; color: var(--ink-faint); }
  .day-temp span { color: var(--ink); }

  /* === LOADING SKELETON — shown while forecast data is being fetched ===
     A subtle horizontal shimmer sweeps across placeholder bars to indicate
     the app is actively loading, without blocking the UI. */
  @keyframes shimmer {
    0%   { background-position: -200px 0; }
    100% { background-position: calc(200px + 100%) 0; }
  }
  
  /* === PULL-TO-REFRESH indicator ===
     A small spinner appears at the top of the sheet as the user pulls down.
     The bottom-sheet itself shifts down by --pull-distance so the user feels
     they are dragging it. */
  @keyframes ptr-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .ptr-indicator {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translate(-50%, calc(-100% + var(--pull-distance, 0px)));
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--paper-elev);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 10;
  }
  .bottom-sheet.is-pulling .ptr-indicator {
    opacity: 1;
    transition: none;
  }
  .ptr-indicator-arrow {
    width: 14px;
    height: 14px;
    color: var(--gold);
    transition: transform 0.2s ease;
  }
  .ptr-indicator.is-ready .ptr-indicator-arrow {
    transform: rotate(180deg);
  }
  .ptr-indicator.is-refreshing .ptr-indicator-arrow {
    animation: ptr-spin 0.8s linear infinite;
  }
  /* Pull-distance translation on the sheet itself */
  .bottom-sheet.is-pulling {
    transform: translateY(calc(var(--pull-distance, 0px) * -1));
    transition: none;
  }
  .bottom-sheet.is-snapping {
    transition: transform 0.25s ease;
    transform: translateY(0);
  }
  .skeleton-card {
    width: 100%;
    height: 128px;
    flex-shrink: 0;
    position: relative;
    border-bottom: 1px solid var(--line-soft);
    padding: 8px 16px;
    box-sizing: border-box;
  }
  .skeleton-bar {
    background: linear-gradient(
      90deg,
      rgba(240, 230, 210, 0.04) 0%,
      rgba(240, 230, 210, 0.10) 50%,
      rgba(240, 230, 210, 0.04) 100%
    );
    background-size: 200px 100%;
    background-repeat: no-repeat;
    border-radius: 4px;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  .skeleton-head {
    height: 14px;
    width: 100px;
    margin: 8px auto;
  }
  .skeleton-graph {
    height: 64px;
    width: calc(100% - 30px);
    margin: 8px auto;
    border-radius: 8px;
  }
  /* Hide skeleton once weekly-stack has any real .day-card children */
  .weekly-stack:has(.day-card) .skeleton-card {
    display: none;
  }

  /* === WEEKLY STACK — vertically scrollable list of day-cards + altitude panel === */
  .weekly-stack {
    flex: 1;
    min-height: 128px;  /* always fit at least one full day-card row */
    overflow-y: hidden;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  .bottom-sheet.expanded .weekly-stack {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .weekly-stack::-webkit-scrollbar { display: none; }
  
  /* On wider screens, show day-cards in a multi-column grid:
       <  720px → 1 column  (mobile)
       720-1080 → 2 columns (tablet)
       ≥ 1080px → 3 columns (desktop)
     The altitude panel always spans the full width. */
  @media (min-width: 720px) {
    .weekly-stack {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: 128px;
      align-content: start;
    }
    .alt-panel {
      grid-column: 1 / -1;
    }
  }
  @media (min-width: 1080px) {
    .weekly-stack {
      grid-template-columns: 1fr 1fr 1fr;
    }
  }
  
  /* One day-card per day: header (date + temp) + chart fitting full container width */
  .day-card {
    width: 100%;
    height: 128px;  /* 36px header + 92px chart (4px buffer for time labels) */
    flex-shrink: 0;
    position: relative;
    border-bottom: 1px solid var(--line-soft);
  }
  /* Vertical column borders between grid cells.
     Easier than nth-child arithmetic: render a right border on every cell,
     then remove it from cells that sit on the rightmost column. We can't
     reliably target the last column with CSS alone for variable counts, so
     we set the right border based on each layout's column count. */
  @media (min-width: 720px) {
    .day-card {
      border-right: 1px solid var(--line-soft);
    }
    /* Hide right border on the rightmost column (every 2nd card) for 2-col layout */
    .day-card:nth-child(2n) {
      border-right: none;
    }
  }
  @media (min-width: 1080px) {
    /* For 3-col layout, restore the right border on every card... */
    .day-card:nth-child(2n) {
      border-right: 1px solid var(--line-soft);
    }
    /* ...then hide it on every 3rd card (rightmost column) */
    .day-card:nth-child(3n) {
      border-right: none;
    }
  }
  .day-card:last-of-type { border-bottom: none; }
  
  /* Crossfade behavior: when the selected day changes (head tap → close), the
     day-cards smoothly fade opacity so the user sees content swap rather than
     snap. Default is fully visible; the .is-fading class temporarily reduces
     opacity during the swap. */
  .day-card {
    transition: opacity 0.25s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .day-card.is-fading {
    opacity: 0;
  }
  /* Staggered reveal when the sheet expands: each card starts pushed slightly
     down + transparent, and rises up + fades in with a small per-card delay.
     The transition-delay is set inline by JS based on dayIdx so the animation
     looks like a chain pull from above. */
  .bottom-sheet.is-revealing .day-card {
    opacity: 0;
    transform: translateY(20px);
  }
  /* When the sheet is fully expanded, cards transition back to their natural
     state with a stagger — driven by inline --reveal-delay variables. */
  .bottom-sheet.expanded .day-card {
    opacity: 1;
    transform: translateY(0);
    transition:
      opacity 0.35s ease var(--reveal-delay, 0ms),
      transform 0.45s cubic-bezier(0.22, 1, 0.36, 1) var(--reveal-delay, 0ms);
  }
  .day-card-head {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    height: 36px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .day-card-head:active { background: rgba(255, 255, 255, 0.04); }
  .day-card-chart {
    position: relative;
    width: 100%;
    height: 92px;
  }

  /* Chart sub-region inside each day-card.
     Layout (top to bottom):
       0–18px : wind speed + arrow combo
       18–78px: chart canvas
       78–92px: time labels */
  .chart-region {
    position: relative;
    width: 100%;
    height: 92px;
    flex-shrink: 0;
  }

  /* Wind info (speed + direction arrow) at the top of the chart region */
  .wind-info-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 18px;
    pointer-events: none;
    z-index: 5;
  }
  .wind-info-col {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    line-height: 1;
    white-space: nowrap;
    filter: drop-shadow(0 0 3px rgba(13, 20, 38, 0.9));
    pointer-events: auto;
    cursor: pointer;
    padding: 2px 6px;
    -webkit-tap-highlight-color: transparent;
  }
  .wind-info-col:active {
    transform: translateX(-50%) scale(1.12);
    transition: transform 0.1s ease;
  }
  .wind-info-col .w-speed {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: -0.02em;
  }
  .wind-info-col .w-arrow {
    font-size: 0.85rem;
    color: var(--ink);
  }

  /* Time labels at the bottom of the chart's x-axis */
  .time-overlay {
    position: absolute;
    bottom: 8px;
    left: 0;
    width: 100%;
    height: 14px;
    pointer-events: none;
    z-index: 5;
  }
  .time-col {
    position: absolute;
    bottom: 0;
    transform: translateX(-50%);
    font-size: 0.7rem;
    color: var(--ink-faint);
    font-weight: 600;
    font-family: 'JetBrains Mono', 'Inter', sans-serif;
    letter-spacing: -0.02em;
    white-space: nowrap;
    line-height: 1;
  }

  .chart-wrapper {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Y-axis labels are now drawn inside the chart canvas alongside day boundaries */

  /* === ALTITUDE PANEL (revealed on expand) === */
  .alt-panel {
    padding: 12px 16px 4px;
    border-top: 1px solid var(--line-soft);
    margin-top: 0;
    background: transparent;
  }
  
  /* (Per-hour wind speed numbers are rendered directly above the time labels in
     the .wind-speeds-overlay; see chart-region.) */
  .alt-panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0 10px;
    border-bottom: 1px solid var(--line-soft);
    flex-shrink: 0;
  }
  .alt-panel-title {
    font-family: 'Inter', 'Noto Sans JP', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .alt-list {
    list-style: none;
    margin: 0; padding: 0;
    overflow: hidden;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .alt-list li {
    display: grid;
    grid-template-columns: 60px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--line-soft);
    flex: 1;
    min-height: 0;
  }
  .alt-list li:last-child { border-bottom: none; }
  .alt-h {
    font-family: 'Inter', 'Noto Sans JP', sans-serif;
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1;
    color: var(--ink);
  }
  .alt-bar-track {
    height: 4px;
    background: rgba(240, 230, 210, 0.08);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .alt-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease, background 0.3s ease;
  }
  .alt-v {
    /* Match the top-right wind speed style for visual consistency */
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: -0.02em;
    line-height: 1;
    text-align: right;
    min-width: 60px;
  }
  .alt-v .u {
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-size: 0.6rem;
    color: var(--ink-faint);
    margin-left: 2px;
    font-weight: 600;
  }
  .alt-arr {
    font-size: 1.1rem;
    width: 20px;
    text-align: center;
    color: var(--ink);
  }

  /* Data source attribution at bottom of sheet — visible only when expanded */
  .data-source {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--ink-faint);
    text-align: right;
    padding: 8px 16px 4px;
    flex-shrink: 0;
    letter-spacing: 0.04em;
    line-height: 1.4;
    display: none;  /* hidden when collapsed */
  }
  .bottom-sheet.expanded .data-source {
    display: block;
  }
  .data-source a {
    color: var(--ink-faint);
    text-decoration: none;
    border-bottom: 1px dotted rgba(240, 230, 210, 0.3);
    transition: color 0.15s, border-color 0.15s;
  }
  .data-source a:hover,
  .data-source a:active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  .leaflet-control-zoom { display: none; }
  .leaflet-control-attribution {
    background: rgba(255, 255, 255, 0.85) !important;

    font-size: 9px !important;

  .leaflet-control-attribution a { color: rgba(60, 60, 60, 0.9) !important; }

  /* === REGISTER MODAL === */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 100;

  .modal {
    background: var(--paper-elev);
    border: 1px solid var(--line);

  .modal h3 {

    display: block;
    font-size: 0.75rem;

    margin-bottom: 4px;
  }
  .modal input {
    width: 100%;
    padding: 10px 12px;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--line);
    border-radius: 6px;

    margin-bottom: 12px;
  }
  .modal input:focus { outline: none; border-color: var(--gold); }
  .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .btn {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--ink);
