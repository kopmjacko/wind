      for (let d = 0; d < DAYS; d++) buildDayCard(d);
    }

    // === Y-AXIS STEP HELPER ===
    // Pick a reasonable step so labels don't crowd: 1 m/s for small ranges, 2 m/s
    // for typical paramotor ranges (5–10), 3 m/s for unusual highs.
    // Used by both the chart's gridline stepSize and dayBoundaryPlugin's labels.
    function pickYStep(maxVal) {
      if (maxVal <= 5) return 1;
      if (maxVal <= 12) return 2;
      return 3;
    }

    // === SELECTION + ALERT ===
    let selectedIndex = 2;

    // Render an altitude panel inline inside a day-card. The hour shown is the
    // currently selected hour within that day (so each day card shows that day's
    // altitude profile at the same hour-of-day the user is viewing elsewhere).
    // Content sits inside .day-card-alt-panel-inner so we can apply horizontal
    // padding without breaking the parent's height-based open/close animation.
    function renderDayAltPanel(panelEl, dayIdx) {
      const hour = selectedIndex % POINTS_PER_DAY;
      const idx = dayIdx * POINTS_PER_DAY + hour;
      const profile = altitudeProfileFor(idx);
      const maxSpeed = Math.max(...profile.map(p => p.speed), 12);
      panelEl.innerHTML = `
        <div class="day-card-alt-panel-inner">
          <ul class="alt-list">
            ${profile.map(p => {
              const pct = Math.min(100, (p.speed / maxSpeed) * 100);
              const color = speedColor(p.speed);
              return `
                <li>
                  <span class="alt-h">${p.label}</span>
                  <span class="alt-bar-track"><span class="alt-bar-fill" style="width:${pct}%; background:${color};"></span></span>
                  <span class="alt-v" style="color:${color}">${p.speed.toFixed(1)}<span class="u">m/s</span></span>
                  <span class="alt-arr">${windArrow(p.dir)}</span>
                </li>
              `;
            }).join('')}
          </ul>
        </div>
      `;
    }

    // Toggle the inline altitude panel for a specific day-card. Open and close
    // are mirror sequences using the same height transition as the bottom sheet.
    //
    // Open  (forward):  render content → add .alt-open (button rotates/turns gold)
    //                                  → height: 0 → scrollHeight (over 0.32s)
    // Close (reverse):  height: scrollHeight → 0 (over 0.32s)
    //                                       → on transitionend: remove .alt-open
    //                                         (button rotates back / turns gray)
    function toggleDayAltPanel(card, dayIdx) {
      let panel = card.querySelector('.day-card-alt-panel');
      if (!panel) {
        panel = document.createElement('div');
        panel.className = 'day-card-alt-panel';
        card.appendChild(panel);
      }
      const willOpen = !card.classList.contains('alt-open');
      if (willOpen) {
        // === OPEN sequence ===
        renderDayAltPanel(panel, dayIdx);
        card.classList.add('alt-open');
        panel.style.height = '0px';
        requestAnimationFrame(() => {
          panel.style.height = panel.scrollHeight + 'px';
          updateCollapsedSheetHeight();
        });
      } else {
        // === CLOSE sequence (reverse of open) ===
        panel.style.height = panel.scrollHeight + 'px';
        // Animate sheet height back down in sync with the panel
        {
          sheet.classList.remove('has-alt-open');
          // 現在のモード (単日/マルチ) に応じた高さへ戻す
          const CARD_UNIT = CONTENT_COLLAPSED + DAY_CARD_MARGIN;
          const sdAttr = document.body.dataset.singleDay;
          const isSingle = sdAttr != null && sdAttr !== '';
          const baseH = (isSingle ? CARD_UNIT : CARD_UNIT * 3) + STACK_TOP_PAD;
          setSheetHeight(baseH);
          // has-alt-open 解除で全カード再表示 → 選択日カードを上端に復元
          requestAnimationFrame(() => {
            if (isSingle) {
              const selCard = weeklyStack.querySelector(`.day-card[data-day-idx="${sdAttr}"]`);
              if (selCard) {
                const padTop = parseFloat(getComputedStyle(weeklyStack).paddingTop) || 0;
                weeklyStack.scrollTop = Math.max(0, selCard.offsetTop - padTop);
              }
            } else {
              weeklyStack.scrollTop = 0;
            }
          });
        }
        requestAnimationFrame(() => {
          panel.style.height = '0px';
        });
        // When height transition finishes, remove .alt-open so the button
        // color/rotation reverts (mirroring how it appeared on open)
        const onEnd = (e) => {
          if (e.propertyName !== 'height') return;
          panel.removeEventListener('transitionend', onEnd);
          card.classList.remove('alt-open');
        };
        panel.addEventListener('transitionend', onEnd);
      }
    }

    // Compute and set the collapsed sheet's expanded height based on any open
    // inline alt-panel in the visible pinned day-card.
    function updateCollapsedSheetHeight() {
      // Find the day-card that is currently pinned (= the one matching selectedIndex)
      const selDay = Math.floor(selectedIndex / POINTS_PER_DAY);
      const pinned = weeklyStack.querySelector(`.day-card[data-day-idx="${selDay}"]`);
      const anyOpen = pinned && pinned.classList.contains('alt-open');
      sheet.classList.toggle('has-alt-open', !!anyOpen);
      // ALT 展開中は alt-open カードのみ表示 (CSSで他を非表示) → scrollTop は 0 が正位置
      if (anyOpen) weeklyStack.scrollTop = 0;
      if (anyOpen) {
        // Read panel height after the next frame so CSS transition has applied
        requestAnimationFrame(() => {
          const panel = pinned.querySelector('.day-card-alt-panel');
          // Use scrollHeight to get full content height regardless of max-height
          const panelH = panel ? panel.scrollHeight : 0;
          // 単日モードのシート高 (カード1枚 + margin + top pad) + パネル高
          const base = CONTENT_COLLAPSED + DAY_CARD_MARGIN + STACK_TOP_PAD;
          const total = base + panelH;
          document.documentElement.style.setProperty('--sheet-h-collapsed-alt', total + 'px');
          setSheetHeight(total);
        });
      } else {
        // ALTパネル閉: 現在のモード (単日/マルチ) に応じた高さへ戻す
        const CARD_UNIT = CONTENT_COLLAPSED + DAY_CARD_MARGIN;
        const sdAttr = document.body.dataset.singleDay;
        const isSingle = sdAttr != null && sdAttr !== '';
        const baseH = (isSingle ? CARD_UNIT : CARD_UNIT * 3) + STACK_TOP_PAD;
        setSheetHeight(baseH);
        // 単日モードなら選択日カードを上端に復元 (ALT中は他カード非表示で scrollTop=0 だった)
        requestAnimationFrame(() => {
          if (isSingle) {
            const card = weeklyStack.querySelector(`.day-card[data-day-idx="${sdAttr}"]`);
            if (card) {
              const padTop = parseFloat(getComputedStyle(weeklyStack).paddingTop) || 0;
              weeklyStack.scrollTop = Math.max(0, card.offsetTop - padTop);
            }
          } else {
            weeklyStack.scrollTop = 0;
          }
        });
      }
    }

    // Smoothly tween a numeric value over `duration` ms, calling `onTick(value)`
    // on each frame. Returns a cancel function. Used for animating the top-bar
    // wind speed when the user picks a different time/day, so the value glides
    // from its previous reading to the new one rather than snapping.
    const tweenHandles = new WeakMap();
    function tweenNumber(key, fromVal, toVal, duration, onTick) {
      // Cancel any in-progress tween bound to the same key (e.g. the same DOM
      // element) so a rapid sequence of selections doesn't pile up.
      const prev = tweenHandles.get(key);
      if (prev) cancelAnimationFrame(prev.raf);

      const t0 = performance.now();
      const handle = { raf: 0 };
      tweenHandles.set(key, handle);
      const step = (now) => {
        const t = Math.min(1, (now - t0) / duration);
        // Ease-out cubic — fast at start, settles smoothly at end
        const eased = 1 - Math.pow(1 - t, 3);
        const v = fromVal + (toVal - fromVal) * eased;
        onTick(v);
        if (t < 1) {
          handle.raf = requestAnimationFrame(step);
        } else {
          tweenHandles.delete(key);
        }
      };
      handle.raf = requestAnimationFrame(step);
    }

    function updateSelection(idx) {
      const prevSpeed = selectedIndex != null && avgWindSpeeds[selectedIndex] != null
        ? avgWindSpeeds[selectedIndex]
        : 0;
      selectedIndex = idx;

      const topSpeedEl = document.getElementById('topWindSpeed');
      const currentSpeed = avgWindSpeeds[idx];

      // Tween the top-bar wind speed from its previous value to the new one
      tweenNumber(topSpeedEl, prevSpeed, currentSpeed, 350, (v) => {
        topSpeedEl.innerHTML = `${v.toFixed(1)}<small>m/s</small>`;
        topSpeedEl.style.color = speedColor(v);
      });

      // Replace the old "最大 X m/s" text with the timestamp of the selected forecast
      const dt = fullTimestamps[idx];
      if (dt) {
        const dayStr = `${dt.getMonth()+1}/${dt.getDate()}(${dow[dt.getDay()]})`;
        const timeStr = `${String(dt.getHours()).padStart(2,'0')}:00`;
        const timeEl = document.getElementById('topWindTime');
        if (timeEl) timeEl.textContent = `${dayStr} ${timeStr}`;
      }
      document.getElementById('topWindDir').style.transform = `rotate(${windDirs[idx] + 180}deg)`;
      // Point styling is handled by scriptable functions on each day-card chart;
      // they read selectedIndex on every draw, so we just trigger a redraw on all.
      for (const c of dayCharts) if (c) c.update('none');
      // Kick off the expanding-ring animation around the newly selected dot
      triggerSelectionAnim();
      // Refresh any open inline day-card alt panels so they reflect the new hour
      weeklyStack.querySelectorAll('.day-card.alt-open').forEach((card) => {
        const d = parseInt(card.dataset.dayIdx, 10);
        const panel = card.querySelector('.day-card-alt-panel');
        if (panel && !isNaN(d)) {
          renderDayAltPanel(panel, d);
          // Content height may have changed slightly — re-measure
          panel.style.height = panel.scrollHeight + 'px';
        }
      });
      // Update wind particle animation params
      windFlow.setWind(currentSpeed, windDirs[idx]);
    }

    // === REFRESH UI AFTER DATA LOADS / CHANGES ===
    let hasInitialSelection = false;
    
    // Initial selection: today's forecast hour nearest to the current wall-clock
    // time. If the user opens the app at 14:20, this picks 13:00 (index 2); at
    // 08:00 it picks 07:00; at 21:00 it picks 19:00. Always returns a valid
    // index into today (day 0), so the app opens focused on "now" rather than a
    // fixed morning slot.
    function pickIndexForNow() {
      const nowH = new Date().getHours() + new Date().getMinutes() / 60;
      let closestI = 0, minDiff = Infinity;
      FORECAST_HOURS.forEach((fh, i) => {
        const diff = Math.abs(fh - nowH);
        if (diff < minDiff) { minDiff = diff; closestI = i; }
      });
      return closestI;  // day 0 (today), hour index nearest to now
    }
    
    function refreshAfterDataLoaded() {
      // Build (or rebuild) the weekly stack with all 7 day-cards
      renderWeeklyStack();

      // First load: pick the time nearest to now; preserve selection on subsequent loads
      if (!hasInitialSelection) {
        selectedIndex = pickIndexForNow();
        hasInitialSelection = true;
      }
      if (selectedIndex >= avgWindSpeeds.length) selectedIndex = 0;

      requestAnimationFrame(() => scrollToSelectedDay(false));
      updateSelection(selectedIndex);
      // Note: overlay positions (wind-info / time-col) sync automatically via
      // each chart's afterDraw plugin (makeOverlaySyncPlugin), so no explicit
      // sync call is needed here — Chart.js will trigger draws as it lays out.
    }

    // Move the day-card matching `selectedIndex`'s day to the top of weekly-stack
    // so that when the sheet is collapsed, that day is visible.
    // Smoothly scroll the weekly-stack so the selected day-card sits at the top
    // of the visible viewport. When the sheet collapses, this leaves the
    // selected day-card pinned as the visible row. All 7 day-cards stay in
    // chronological order; we just adjust scroll position.
    function scrollToSelectedDay(animate = true) {
      const selDay = Math.floor(selectedIndex / POINTS_PER_DAY);
      const card = weeklyStack.querySelector(`.day-card[data-day-idx="${selDay}"]`);
      if (!card) return;
      // padding-top を差し引くことで、weekly-stack 上部のパディングが常に見える状態を維持
      const stackPadTop = parseFloat(getComputedStyle(weeklyStack).paddingTop) || 0;
      const targetTop = Math.max(0, card.offsetTop - stackPadTop);
      if (animate && weeklyStack.scrollTo) {
        weeklyStack.scrollTo({ top: targetTop, behavior: 'smooth' });
      } else {
        weeklyStack.scrollTop = targetTop;
      }
    }


    // === LOAD + REFRESH (used at startup and on point change) ===
    let isLoading = false;
    let lastLoadedLat = null;
    let lastLoadedLon = null;
    function showLoadingSkeleton() {
      // Replace the weekly-stack contents with a single shimmer placeholder so
      // the user sees that something is happening (rather than stale data).
      weeklyStack.innerHTML = `
        <div class="skeleton-card">
          <div class="skeleton-bar skeleton-head"></div>
          <div class="skeleton-bar skeleton-graph"></div>
        </div>
      `;
    }
    async function loadAndRefresh(lat, lon) {
      if (isLoading) return;
      isLoading = true;
      showLoadingSkeleton();
      try {
        await loadForecast(lat, lon);
        lastLoadedLat = lat;
        lastLoadedLon = lon;
        refreshAfterDataLoaded();
      } catch (err) {
        console.error('Forecast load failed:', err);
      } finally {
        isLoading = false;
      }
    }

    // Initial fetch — uses initialLat/initialLon resolved during bootstrap
    setTimeout(() => loadAndRefresh(initialLat, initialLon), 50);

    // Re-sync overlay positions when the window resizes
    window.addEventListener('resize', () => {
      requestAnimationFrame(syncOverlayPositions);
    });

    // === 単日/マルチデイ トグル ===
    // デフォルトはマルチデイ(3日表示)。日付ヘッダタップ → その日だけ表示。
    // 同じ日をもう一度タップ → マルチデイに戻る。別の日をタップ → その日に切替。
    // body.dataset.singleDay に日インデックス(文字列)を格納 / 未設定 = マルチデイ。

    // === シート高さ制御を一元化 ===
    // inline style height を直接書き、transition 中は毎フレーム地図を追従させる。
    function setSheetHeight(px) {
      const sheetEl = document.getElementById('bottomSheet');
      if (!sheetEl) return;
      sheetEl.style.height = px + 'px';
      // CSS 変数も同期 (FAB 位置などが参照)
      document.documentElement.style.setProperty('--sheet-h', px + 'px');
      // transition (0.32s) 中、毎フレーム Leaflet をリサイズ + 中心を固定。
      // 測定地点 (map center) が常に地図領域の中央に保たれ、滑らかに追従する。
      if (typeof map !== 'undefined' && map && map.invalidateSize) {
        const center = map.getCenter();
        const zoom = map.getZoom();
        const start = performance.now();
        cancelAnimationFrame(setSheetHeight._raf);
        const step = (now) => {
          map.invalidateSize({ animate: false });
          map.setView(center, zoom, { animate: false });
          if (now - start < 400) {  // transition 0.32s + 余裕
            setSheetHeight._raf = requestAnimationFrame(step);
          }
        };
        setSheetHeight._raf = requestAnimationFrame(step);
      }
    }

    function setSingleDay(dayIdx) {
      // 直前の単日選択 (マルチ復帰時の表示ウィンドウ計算に使用)
      const prevAttr = document.body.dataset.singleDay;
      const prevDay = (prevAttr != null && prevAttr !== '') ? parseInt(prevAttr, 10) : null;
      // dayIdx = null → マルチデイに戻る
      if (dayIdx == null) {
        delete document.body.dataset.singleDay;
      } else {
        document.body.dataset.singleDay = String(dayIdx);
      }
      // 全カードは常に DOM に存在・表示。bottom-sheet の height 変化と
      // transform シフトで表示範囲を切り替え。
      // シート高: 単日 = 1カード分, マルチ = 3カード分
      const CARD_UNIT = CONTENT_COLLAPSED + DAY_CARD_MARGIN;
      const sheetH = ((dayIdx != null) ? CARD_UNIT : CARD_UNIT * 3) + STACK_TOP_PAD;
      // 閉じ方向はジャンプ段階の後に setSheetHeight を呼ぶ (下のスクロール制御内)。
      // 開き方向はここで即開始。
      if (dayIdx == null) setSheetHeight(sheetH);
      // 選択予報点更新
      if (avgWindSpeeds.length > 0) {
        if (dayIdx != null) {
          const hourInDay = pickIndexForNow();
          updateSelection(dayIdx * POINTS_PER_DAY + hourInDay);
        } else if (selectedIndex != null) {
          updateSelection(selectedIndex);
        }
      }
      // (上のカードは消さない: シート上端の降下が覆い隠すため、全カード常時表示)

      // === スクロールアニメーション ===
      const padTop = parseFloat(getComputedStyle(weeklyStack).paddingTop) || 0;
      const padBottom = parseFloat(getComputedStyle(weeklyStack).paddingBottom) || 0;
      cancelAnimationFrame(setSingleDay._scrollRaf);
      clearTimeout(setSingleDay._scrollT);
      const DURATION = 400;  // CSS transition 0.32s + 余裕
      const scrollStart = performance.now();

      if (dayIdx != null) {
        // --- 閉じ方向 (単日展開): 2段階 ---
        // [1] ジャンプ: transition を無効化し、シート上端をタップカード直上へ瞬時移動。
        //     --sheet-h 連動で #map も同時拡大 → 上のカード+ベース領域が即座に地図になる。
        //     scrollTop も同時にタップカード位置へ (タップカードは画面上不動)。
        // [2] スライド: transition を戻し、1日高へアニメーション。
        //     タップカードはシート上端に密着したまま下降 (全日程で1日目と同一の動き)。
        const card = weeklyStack.querySelector(`.day-card[data-day-idx="${dayIdx}"]`);
        const endScroll = Math.max(0, (card ? card.offsetTop : 0) - padTop);
        const startScroll = weeklyStack.scrollTop;
        const sheetEl2 = document.getElementById('bottomSheet');
        const curH = sheetEl2 ? sheetEl2.getBoundingClientRect().height : 0;
        // タップカード上端の、シート上端からの視覚オフセット (padTop 分は残す)
        const drop = Math.max(0, (card ? card.offsetTop : 0) - startScroll - padTop);
        const interH = Math.max(sheetH, curH - drop);  // 中間高 (最終高より小さくしない)
        if (drop > 0 && sheetEl2) {
          // [1] ジャンプ (transition 無効の 1 フレーム)
          document.body.classList.add('snap-jump');
          sheetEl2.style.height = interH + 'px';
          document.documentElement.style.setProperty('--sheet-h', interH + 'px');
          weeklyStack.scrollTop = endScroll;
          void sheetEl2.offsetHeight;  // 強制リフロー (ジャンプを確定)
          document.body.classList.remove('snap-jump');
        } else {
          weeklyStack.scrollTop = endScroll;
        }
        // [2] スライド: 最終高へアニメーション (setSheetHeight が map 同期も担当)
        setSheetHeight(sheetH);
        setSingleDay._scrollT = setTimeout(() => { weeklyStack.scrollTop = endScroll; }, DURATION + 40);
      } else {
        // --- 開き方向 (マルチ復帰): 選択日が極力動かない 3日ウィンドウを表示 ---
        // 表示ウィンドウの最上日 topDay:
        //   d=0,1     → 0        (d=0: 上段 / d=1: 中央)
        //   d=2..4    → d-2      (選択日は下段 = 画面上動かない)
        //   d=DAYS-2  → DAYS-3   (下から2番目: 中央)
        //   d=DAYS-1  → DAYS-3   (最下日: 下段 = 動かない)
        let targetScroll = 0;
        if (prevDay != null) {
          let topDay;
          if (prevDay <= 1) topDay = 0;
          else if (prevDay === DAYS - 2) topDay = DAYS - 3;
          else topDay = Math.min(prevDay - 2, DAYS - 3);
          targetScroll = topDay * (CONTENT_COLLAPSED + DAY_CARD_MARGIN);
        }
        // "下端アンカー" 方式: 毎フレーム実測 viewport から、直前の選択カードの
        // 下端がシート下端に揃う scrollTop を計算し、目標値との max を取る。
        // → 下段ケースではカードが 1px も動かず、中央/上段ケースでは前半静止 →
        //   後半シート上端と共に上昇。バウンスなし。
        const prevCard = prevDay != null
          ? weeklyStack.querySelector(`.day-card[data-day-idx="${prevDay}"]`) : null;
        const pCardTop = prevCard ? prevCard.offsetTop : 0;
        const pCardH = prevCard ? prevCard.offsetHeight : CONTENT_COLLAPSED;
        // 単日ビューの scrollTop と同値だが、状態を明示的に揃えてから開始する
        weeklyStack.scrollTop = Math.max(0, pCardTop - padTop);
        const scrollStep = (now) => {
          const viewportH = weeklyStack.clientHeight;  // 実測 (transition 途中の値)
          const anchor = pCardTop + pCardH + padBottom - viewportH;
          weeklyStack.scrollTop = Math.max(targetScroll, anchor);
          if (now - scrollStart < DURATION) {
            setSingleDay._scrollRaf = requestAnimationFrame(scrollStep);
          } else {
            weeklyStack.scrollTop = targetScroll;  // 最終確定
          }
        };
        setSingleDay._scrollRaf = requestAnimationFrame(scrollStep);
        setSingleDay._scrollT = setTimeout(() => { weeklyStack.scrollTop = targetScroll; }, DURATION + 40);
      }

      requestAnimationFrame(() => {
        for (const c of dayCharts) if (c) c.resize();
        syncOverlayPositions();
        // 地図の invalidateSize は setSheetHeight のフレームループが担当
      });
    }

    function toggleSingleDay(dayIdx) {
      const cur = document.body.dataset.singleDay;
      if (cur != null && cur !== '' && parseInt(cur, 10) === dayIdx) {
        setSingleDay(null);  // 同じ日タップ → マルチに戻る
      } else {
        setSingleDay(dayIdx);
      }
    }

    // 日付ヘッダタップで単日/マルチをトグル
    // (day-card-head 内の alt-toggle ボタンは除外)
    document.addEventListener('click', (e) => {
      // ALT ボタンや ALT パネル内タップは通す
      if (e.target.closest('.alt-toggle')) return;
      if (e.target.closest('.day-card-alt-panel')) return;
      const head = e.target.closest('.day-card-head');
      if (!head) return;
      const card = head.closest('.day-card');
      if (!card) return;
      const d = parseInt(card.dataset.dayIdx, 10);
      if (Number.isNaN(d)) return;
      // ALT パネル展開中は、日付ヘッダタップ = ALT クローズ (単日/マルチ切替はしない)
      const sheetHasAlt = sheet.classList.contains('has-alt-open');
      if (sheetHasAlt && card.classList.contains('alt-open')) {
        toggleDayAltPanel(card, d);  // クローズ動作 (alt-open 状態なので閉じる)
        return;
      }
      toggleSingleDay(d);
    });

    // 1分ごとに Chart を再描画 (現在時刻縦線を更新) - 当日のグラフに反映
    setInterval(() => {
      if (dayCharts[0]) {
        dayCharts[0].update('none');
      }
    }, 60 * 1000);

    // === BOTTOM SHEET — tap on the first day-card head to toggle ===
    const sheet = document.getElementById('bottomSheet');
    
    // Internal content heights
    // 1 day-card exactly: 36px header + 72px chart + 21px time labels = 129px
    const CONTENT_COLLAPSED = 129;
    // day-card 同士の間のマージン (CSS --day-card-margin と同期)
    const DAY_CARD_MARGIN = 4;
    // リスト最上部の day-card 上のパディング (CSS --stack-top-pad と同期)
    const STACK_TOP_PAD = 4;
    const COLLAPSED = CONTENT_COLLAPSED;


    // Tap-to-toggle handled by each day-card-head's click listener (see buildDayCard).
    // No separate gesture handler needed — vertical scroll inside the expanded sheet
    // works natively via the .weekly-stack overflow-y: auto.

    // Initial sheet height var for FAB positioning
    // マルチデイ(3日)がデフォルトなので 3 × (COLLAPSED + MARGIN) + TOP_PAD
    document.documentElement.style.setProperty('--sheet-h',
      ((COLLAPSED + DAY_CARD_MARGIN) * 3 + STACK_TOP_PAD) + 'px');

    // === PULL-TO-REFRESH ===
    // When the user drags the bottom-sheet down (only valid when the sheet is
    // already scrolled to top, or when collapsed), the sheet visually drops by
    // the drag distance and shows a refresh indicator. Releasing past a
    // threshold triggers a data reload; below the threshold cancels.
    (() => {
      const PTR_THRESHOLD = 60;     // px pull required to trigger refresh
      const PTR_MAX = 100;          // visual cap on pull distance
      const ptrIndicator = document.getElementById('ptrIndicator');
      let ptrActive = false;
      let ptrStartY = 0;
      let ptrDistance = 0;
      let ptrPointerId = null;

      function canStartPull() {
        // 現行仕様: シートは常に collapsed 相当のためプル開始は常に許可
        return true;
      }

      function setPullDistance(d) {
        ptrDistance = d;
        const capped = Math.min(PTR_MAX, Math.max(0, d));
        sheet.style.setProperty('--pull-distance', capped + 'px');
        ptrIndicator.classList.toggle('is-ready', capped >= PTR_THRESHOLD);
      }

      function onPointerDown(e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (!canStartPull()) return;
        ptrPointerId = e.pointerId;
        ptrStartY = e.clientY;
        ptrActive = true;
        ptrDistance = 0;
      }

      function onPointerMove(e) {
        if (!ptrActive || e.pointerId !== ptrPointerId) return;
        const dy = e.clientY - ptrStartY;
        if (dy <= 0) {
          // User reversed direction — cancel
          if (ptrDistance > 0) setPullDistance(0);
          return;
        }
        // Engage pulling state once we have meaningful drag and we're still at
        // top of scroll. Apply a rubber-band feel: the distance grows but with
        // diminishing returns past a soft cap.
        if (!sheet.classList.contains('is-pulling')) {
          if (!canStartPull()) return;
          sheet.classList.add('is-pulling');
          sheet.classList.remove('is-snapping');
        }
        // Rubber band: dy * 0.5 with soft cap
        const eased = dy * 0.5;
        setPullDistance(eased);
        if (e.cancelable) e.preventDefault();
      }

      function onPointerEnd(e) {
        if (!ptrActive) return;
        ptrActive = false;
        ptrPointerId = null;
        if (!sheet.classList.contains('is-pulling')) return;
        const triggered = ptrDistance >= PTR_THRESHOLD;
        sheet.classList.remove('is-pulling');
        sheet.classList.add('is-snapping');
        if (triggered) {
          // Show refreshing state, then trigger reload
          ptrIndicator.classList.add('is-refreshing');
          ptrIndicator.classList.remove('is-ready');
          // Use whatever the current active point is for the reload
          const currentLat = lastLoadedLat || initialLat;
          const currentLon = lastLoadedLon || initialLon;
          loadAndRefresh(currentLat, currentLon).finally(() => {
            ptrIndicator.classList.remove('is-refreshing');
          });
        } else {
          ptrIndicator.classList.remove('is-ready');
        }
        // Reset distance after the snap-back animation finishes
        setTimeout(() => {
          sheet.style.setProperty('--pull-distance', '0px');
          sheet.classList.remove('is-snapping');
        }, 260);
      }

      sheet.addEventListener('pointerdown', onPointerDown);
      sheet.addEventListener('pointermove', onPointerMove, { passive: false });
      sheet.addEventListener('pointerup', onPointerEnd);
      sheet.addEventListener('pointercancel', onPointerEnd);
    })();

    // Prevent body bounce-scroll on iOS
    document.body.addEventListener('touchmove', (e) => {
      if (e.target === document.body) e.preventDefault();
    }, { passive: false });
  </script>
  <script>
    // Register PWA service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
